<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETIYA Marketing Cloud · Journeys</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23F58220'/%3E%3Crect x='6' y='6' width='12' height='12' rx='1' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================================
   1. CSS copied from CM-New-UI-UX2 (index.html, v48): tokens, shell, components, journey
   builder, monitor, toast, modal, footer, campaign stepper, visual pass. Same class names.
   ===================================================================================== */
/* Single-theme by design: Etiya commercial palette — navy primary, dark-orange accent, neutral greys. --green keeps its variable name for compatibility but now carries the navy primary; status greens live in --ok. */
:root{
  /* ---- Etiya brand kit ------------------------------------------------
     Primary  Dark Blue & Lilac  #242441 / #5D5D8D
     Secondary Orange            #F58220 / #F9AA56   — accent and tint only
     Complimentary Turquoise     #00B5CB / #37DBDF   — action
     Grey                        #DFE1DF / #EBECEB
     Historical variable names are kept so the rest of the CSS keeps working;
     only their values changed. See docs/brand.md. */
  --brand-navy:#242441; --brand-lilac:#5D5D8D; --brand-lilac-line:#4E4E7A; --brand-nav-hover:#2E2E52;
  /* Chrome surfaces (decision V7): the lilac as a translucent wash over the page instead of a
     solid dark block, so the menu and the bars stop pulling the eye. Dark ink on all of them. */
  --bar-bg:rgba(93,93,141,.14); --nav-bg:rgba(93,93,141,.08); --nav-hover:rgba(93,93,141,.12); --nav-active:rgba(93,93,141,.22); --chrome-line:rgba(93,93,141,.28);
  --sec:#F58220; --sec-light:#F9AA56; --sec-ink:#9E560D; --sec-soft:#FDF0E2;
  --cta:#00818F; --cta-hover:#00707E; --cta-bright:#00B5CB; --cta-light:#37DBDF; --cta-soft:#E2F6F8;
  --grey-1:#DFE1DF; --grey-2:#EBECEB;

  --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#F7F7F9; --ink:#242441; --ink-2:#4A4A60; --ink-3:#6B6B80;
  --line:#DFE1DF; --line-2:#EBECEB;
  --green:#242441; --green-ink:#1A1A33; --green-soft:#ECECF3; --grey-btn:#5A5A70; --dark-btn:#3F3F72;
  --orange:#F58220; --orange-ink:#9E560D; --orange-soft:#FDF0E2;
  --ok:#2A7230; --ok-soft:#E8F3E8; --warn:#9E560D; --warn-soft:#FDF0E2; --bad:#C62828; --bad-soft:#FBE9E9; --acc:#00818F; --acc-soft:#E2F6F8;
  /* journey step tints — re-toned into the brand families, dark ink on each */
  --t-entry:#E2F6F8; --t-entry-i:#00707E;
  --t-delivery:#ECECF3; --t-delivery-i:#242441;
  --t-timer:#FDF0E2; --t-timer-i:#9E560D;
  --t-wait:#E6F4F1; --t-wait-i:#0F7566;
  --t-cond:#E8E6F4; --t-cond-i:#4A4A8C;
  --t-offer:#FBE6D2; --t-offer-i:#9E560D;
  --t-par:#EBECEB; --t-par-i:#5A5A70;
  --t-exit:#DFF2F5; --t-exit-i:#00707E;
  --t-call:#E4E2F0; --t-call-i:#3F3F72;
  --t-ext:#E9F3F5; --t-ext-i:#2A6B78;
  --t-nbo:#DDF1EE; --t-nbo-i:#0B6B5E;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Roboto',system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
  --shadow:0 1px 3px rgba(36,36,65,.07),0 2px 10px rgba(36,36,65,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.43;color-scheme:light}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cta-bright);outline-offset:1px;box-shadow:0 0 0 3px rgba(0,181,203,.35)}
.app{display:grid;grid-template-columns:210px 1fr;grid-template-rows:56px 1fr auto;height:100vh;min-height:680px}
/* top bar */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--bar-bg);border-bottom:1px solid var(--chrome-line);color:var(--ink)}
.logo{display:flex;align-items:center;gap:8px}
.logo .mark{width:22px;height:22px;background:var(--sec);border-radius:3px;position:relative}
.logo .mark::after{content:"";position:absolute;left:5px;top:5px;width:12px;height:12px;background:#fff;opacity:.9;border-radius:1px}
.logo .w{display:flex;flex-direction:column;line-height:1}
.logo .w b{font-size:15px;letter-spacing:.06em;color:var(--brand-navy);font-weight:500}
.logo .w small{font-size:8.5px;letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase}
.burger{width:32px;height:32px;border:1px solid var(--chrome-line);border-radius:50%;background:none;display:grid;place-items:center;margin-left:8px}
.burger i{display:block;width:14px;height:2px;background:var(--brand-navy);box-shadow:0 -4px 0 var(--brand-navy),0 4px 0 var(--brand-navy)}
.tright{margin-left:auto;display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid var(--chrome-line);border-radius:4px;overflow:hidden;color:var(--ink);background:var(--surface)}
.lang span{padding:5px 10px;font-weight:600;font-size:12px}
.lang span+span{border-left:1px solid var(--line);color:var(--ink-2)}
.avatar{display:flex;align-items:center;gap:8px}
.avatar .a{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#F9AA56,#F58220)}
.avatar .n{display:flex;flex-direction:column;line-height:1.15}
.avatar .n b{font-weight:600;font-size:12.5px}
.avatar .n small{color:var(--ink-2);font-size:11px}
.proto{display:flex;align-items:center;gap:8px}
.topbar .pill{background:var(--surface);border-color:var(--chrome-line);color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap;color:var(--ink-2)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--acc-soft);color:var(--cta-hover);border-color:transparent}
/* nav */
.nav{background:var(--nav-bg);border-right:1px solid var(--chrome-line);padding:14px 0;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav .grp{font-size:11px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:12px 16px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--ink);padding:8px 16px 8px 13px;font-size:13px}
.nav button:hover{background:var(--nav-hover);color:var(--brand-navy)}
.nav button.active{background:var(--nav-active);border-left-color:var(--sec);color:var(--brand-navy);font-weight:600}
.nav button[disabled]{cursor:default}
.nav button svg{width:15px;height:15px;stroke:var(--ink-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button.new svg{stroke:var(--sec-ink)}
.nav .foot{margin-top:auto;padding:12px 16px;font-size:11px;color:var(--ink-2);line-height:1.5}
/* collapsible main menu: burger toggles; collapsed = icon rail with tooltips */
.app{transition:grid-template-columns .15s}
.app.nav-closed{grid-template-columns:60px 1fr}
.app.nav-closed .nav{padding:10px 0}
.app.nav-closed .nav .grp{height:1px;padding:0;margin:8px 14px;background:var(--chrome-line);overflow:hidden;font-size:0}
.app.nav-closed .nav .grp:first-child{display:none}
.app.nav-closed .nav button{justify-content:center;padding:10px 0 10px 0;border-left-width:3px;font-size:0;gap:0}
.app.nav-closed .nav button svg{width:18px;height:18px;margin-left:-3px}
.app.nav-closed .nav button.active svg{stroke:var(--brand-navy)}
.app.nav-closed .nav .foot{display:none}
.nav button .nl{white-space:nowrap}
.burger.on{background:var(--nav-active);border-color:var(--brand-lilac)}
/* main */
.main{overflow:hidden;display:flex;flex-direction:column;min-width:0}
.crumb{padding:12px 24px 0;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.crumb b{color:var(--ink-3);font-weight:400;margin:0 6px}
.view{display:none;flex:1;min-height:0;flex-direction:column;padding:12px 24px 16px;gap:12px}
.view.active{display:flex}
.card{background:var(--surface);border-radius:6px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px 8px}
.card-h h2{margin:0;font-size:18px;font-weight:400;color:var(--green);white-space:nowrap}
.card-h p{margin:0;color:var(--ink-2);font-size:12.5px;flex-basis:100%}
.card-h .grow{flex:1}
.plus{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--green);color:var(--green);background:none;display:grid;place-items:center;font-size:18px;line-height:1}
.btn{border:1px solid transparent;background:var(--surface-2);padding:7px 14px;border-radius:4px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn.primary{background:var(--cta);color:#fff}
.btn.primary:hover{background:var(--cta-hover)}
.btn.grey{background:var(--grey-btn);color:#fff}
.btn.dark{background:var(--dark-btn);color:#fff}
.btn.outline{background:none;border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:var(--surface-2);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--surface-2)}
.tbl tr.sel td{background:var(--cta-soft)}
.tbl a,.lnk{color:var(--cta-hover);text-decoration:none;font-weight:500}
.mono{font-family:var(--mono);font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:1fr 340px;gap:12px;flex:1;min-height:0}
.split > .left{overflow:auto;min-width:0;display:flex;flex-direction:column}
.panel{overflow:auto;display:flex;flex-direction:column;min-width:0}
.panel .ph{padding:16px 20px 6px;display:flex;align-items:center;gap:8px}
.panel .ph h3{margin:0;font-size:17px;font-weight:400;color:var(--green)}
.panel .ph .x{margin-left:auto}
.panel .pb{padding:8px 20px 16px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--ink-2)}
.fld label.req::after,.h4 .req::after{content:" *";color:var(--bad)}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:12.5px;width:100%}
.fld input[readonly],.fld textarea[readonly]{background:var(--surface-2)}
.fld textarea{min-height:64px;resize:vertical;font-family:var(--mono);font-size:11.5px}
.fld .row{display:flex;gap:6px}
.fld .row > *{flex:1}
.sec{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-top:8px;border-top:1px solid var(--line-2);margin-top:2px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:1px 7px;font-size:11.5px}
.tag-path{display:flex;flex-wrap:wrap;align-items:center;gap:3px;font-size:12px}
.tag-path .sep{color:var(--ink-3)}
.note{background:var(--warn-soft);border-radius:4px;padding:8px 10px;font-size:12px;color:var(--sec-ink)}
.empty{color:var(--ink-3);padding:24px;text-align:center}
/* journey builder */
.jb{display:grid;grid-template-columns:120px 1fr;flex:1;min-height:0;transition:grid-template-columns .15s}
.jb.pal-closed{grid-template-columns:44px 1fr}
.palette{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.palette .pt{font-weight:600;font-size:13px;display:flex;align-items:center}
.palette .pt .tog{margin-left:auto}
.tog{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;display:grid;place-items:center;color:var(--ink-2);padding:0}
.tog i{display:block;width:12px;height:2px;background:currentColor;box-shadow:0 -4px 0 currentColor,0 4px 0 currentColor}
.jb.pal-closed .palette{padding:10px 6px;align-items:center}
.jb.pal-closed .palette .pt span,.jb.pal-closed .palette .ps{display:none}
.jb.pal-closed .palette .pt .tog{margin:0}
.jb.pal-closed .palette button:not(.tog){width:32px;height:32px;padding:0;justify-content:center;border-radius:6px}
.jb.pal-closed .palette button:not(.tog) i{width:auto;height:auto;background:none;font-size:13px}
.jb.pal-closed .palette button:not(.tog) span{display:none}
.palette .ps{font-size:10.5px;color:var(--ink-3);margin-top:-6px;margin-bottom:4px}
.palette button{display:flex;align-items:center;gap:7px;border:1px solid var(--c);background:var(--surface);color:var(--c);padding:8px 8px;border-radius:5px;text-align:left;font-size:11.5px;font-weight:600}
.palette button:hover{background:var(--bg2)}
.palette button:not(.tog) i{width:18px;height:18px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:10px;font-style:normal;flex:none}
.cright{display:flex;flex-direction:column;min-width:0}
.ctool{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ctool .ic{width:28px;height:28px;border:0;background:none;border-radius:4px;display:grid;place-items:center;color:var(--ink-2)}
.ctool .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ctool .ic.on{border:1.5px solid var(--green);color:var(--green)}
.ctool .grow{flex:1}
.ctool.evbar{background:var(--surface-2);flex-wrap:wrap}
.ctool.evbar select{border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:#fff}
.ctool .dir{display:flex;border-radius:4px;overflow:hidden}
.ctool .dir button{border:0;background:var(--green);color:#fff;width:30px;height:28px;display:grid;place-items:center}
.ctool .dir button+button{background:var(--brand-lilac)}
.ctool .dir svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.canvas-wrap{position:relative;flex:1;overflow:hidden;background:var(--surface);min-height:420px;
  background-image:linear-gradient(var(--line-2) 1px,transparent 1px),linear-gradient(90deg,var(--line-2) 1px,transparent 1px);background-size:24px 24px;cursor:grab;touch-action:none}
.canvas-wrap.panning{cursor:grabbing}
svg.canvas{display:block;width:100%;height:100%;user-select:none}
.node rect.body{fill:#fff;stroke:var(--line);stroke-width:1;rx:6;filter:drop-shadow(0 2px 6px rgba(31,41,55,.08))}
.node.sel rect.body{stroke:var(--cta-bright);stroke-width:2}
.node.lit rect.body{stroke:var(--orange);stroke-width:3;filter:drop-shadow(0 0 8px rgba(242,107,29,.7))}
.node.done rect.body{stroke:var(--brand-lilac);stroke-width:2}
.node.cur rect.body{stroke:var(--sec);stroke-width:3;filter:drop-shadow(0 0 8px rgba(245,130,32,.55));animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.45}}
.edge.taken path{stroke:var(--green);stroke-width:2.5;stroke-dasharray:none}
.edge.taken rect{stroke:var(--green)}
.node rect.head{rx:6}
.node rect.head2{}
.node text{font-family:var(--sans)}
.node text.t{font-size:12px;font-weight:600}
.node text.k{font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.node text.id{font-size:9px;fill:var(--ink-3);font-family:var(--mono)}
.node text.lab{font-size:10px;fill:var(--ink-2)}
.nsel{width:100%;height:100%}
.nname{width:100%;height:100%}
.nname input{width:100%;height:100%;border:1px solid transparent;border-radius:4px;background:transparent;font:600 12px var(--sans);color:var(--ink);padding:0 4px}
.nname input:hover{border-color:var(--line);background:#fff}
.nname input:focus{outline:none;border-color:var(--orange);background:#fff}
.nsel select{width:100%;height:100%;border:1px solid var(--line);border-radius:4px;background:#fff;font:11px var(--sans);color:var(--ink);padding:0 6px;cursor:pointer}
.nsel select:focus{outline:2px solid var(--orange);outline-offset:0}
.node .badge circle{fill:var(--sec);stroke:#fff;stroke-width:2}
.node .badge text{font-size:10px;fill:#fff;font-weight:700;font-family:var(--mono)}
.node circle.port{fill:#fff;stroke:var(--ink-3);stroke-width:1.5}
.node circle.port.out{fill:var(--orange);stroke:var(--orange)}
.edge path{fill:none;stroke:#9B9BB0;stroke-width:1.5;stroke-dasharray:4 3}
.edge text{font-size:10px;fill:var(--ink-2);font-family:var(--sans);font-weight:600}
.edge rect{fill:#fff;stroke:var(--line)}
.legend{position:absolute;right:12px;bottom:12px;font-size:11px;color:var(--ink-3);background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 9px}
/* monitor */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 20px 6px}
.stat{background:var(--surface-2);border-radius:6px;padding:10px 12px}
.stat .l{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:28px;margin-top:2px;color:var(--ink)}
.stat .s{font-size:11.5px;color:var(--ink-2)}
.funnel{display:flex;flex-direction:column;gap:6px;padding:0 20px 8px}
.frow{display:grid;grid-template-columns:210px 1fr 50px;gap:10px;align-items:center;font-size:12.5px}
.frow .bar{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.frow .bar i{display:block;height:100%}
.frow .n{text-align:right;font-variant-numeric:tabular-nums}
.toolrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 20px 10px}
.toolrow select{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.toolrow input[type=range]{width:220px;accent-color:var(--cta)}
.h4{font-size:13px;font-weight:600;color:var(--ink);padding:12px 20px 6px}
.log{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border-radius:6px;padding:8px 10px;max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:3px}
.log div{white-space:pre-wrap}
.log .t{color:var(--ink-3)}
.log .ok{color:var(--ok)} .log .warn{color:var(--warn)} .log .bad{color:var(--bad)} .log .acc{color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px 16px}
.padx{padding:0 20px 16px}
#jsel{max-width:300px;text-overflow:ellipsis}
.ctool{flex-wrap:wrap}
#jtable td:first-child{white-space:nowrap}

/* api */
.api{display:grid;grid-template-columns:280px 1fr;gap:12px;flex:1;min-height:0;padding:0 20px 16px}
.api .list{display:flex;flex-direction:column;gap:6px}
.api .list button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.api .list button.active{border-color:var(--cta);background:var(--cta-soft)}
.api .list .m{font-family:var(--mono);font-size:11px;color:var(--green-ink);font-weight:500}
pre.code{margin:0;background:var(--brand-navy);color:#E6E6F0;border-radius:6px;padding:12px 14px;font-family:var(--mono);font-size:11.5px;overflow:auto;line-height:1.5}
/* toast */
.toast{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast div{background:#fff;border-left:4px solid var(--green);box-shadow:var(--shadow);border-radius:6px;padding:10px 14px;font-size:12.5px;max-width:420px;animation:tin .2s ease-out}
.toast div.warn{border-left-color:var(--warn)} .toast div.bad{border-left-color:var(--bad)}

.node.invalid rect.body{stroke:var(--bad);stroke-width:2}
.node.hl rect.body{stroke:var(--sec);stroke-width:3;filter:drop-shadow(0 0 8px rgba(245,130,32,.45))}
.node.st-added rect.body{stroke:var(--ok);stroke-width:2.5}
.node.st-removed rect.body{stroke:var(--bad);stroke-width:2;stroke-dasharray:5 4;fill:var(--bad-soft)}
.node.st-removed{opacity:.8}
.node.st-changed rect.body{stroke:var(--warn);stroke-width:2.5}
.node text.n{font-size:12px;font-weight:600;fill:var(--green-ink)}
.node text.s{font-size:10.5px;fill:var(--ink-2)}
.node text.stat{font-size:9.5px;fill:var(--ink-2)}
.node text.stat tspan.v{font-weight:700;fill:var(--green-ink)}
.node text.stat tspan.skip{fill:var(--bad)}
.node rect.statbg{fill:var(--surface-2);stroke:var(--line-2)}

.node .collapse:hover circle{stroke:var(--brand-lilac)}
.node .collapse path{stroke:var(--ink-2);fill:none;stroke-width:1.6;stroke-linecap:round}
.node .dst{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.edge path{stroke-dasharray:none}
.edge.dangling path{stroke:var(--bad);stroke-dasharray:5 4}
.edge.hl path{stroke:var(--sec);stroke-width:2.6}
.edge.st-added path{stroke:var(--ok);stroke-width:2.2}
.edge.st-removed path{stroke:var(--bad);stroke-dasharray:6 4;stroke-width:2}

.eplus{cursor:pointer}

.eplus:hover circle,.eplus.hover circle{fill:var(--cta);stroke:var(--cta)}
.eplus:hover path,.eplus.hover path{stroke:#fff}
.canvas-wrap.dropping .eplus circle{r:17;stroke-dasharray:3 3;stroke:var(--cta-bright);fill:rgba(226,246,248,.9)}
.endmark{fill:#fff;stroke:var(--bad);stroke-width:2;stroke-dasharray:3 3}
.stub rect{fill:var(--green-soft);stroke:var(--brand-lilac);stroke-dasharray:4 3}

/* step panel */

.jinfo .ph h3{font-size:15px;line-height:22px;flex:1;min-width:0}

.jinfo .pb .fld input,.jinfo .pb .fld select,.jinfo .pb .fld textarea{font-size:13px;padding:7px 9px;min-height:34px}
.jinfo .kind{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.jinfo .ro{opacity:.75;pointer-events:none}
.pathrow{display:flex;align-items:center;gap:6px}
.pathrow .pl{width:76px;font-size:12px;color:var(--ink-2);flex:none}
.pathrow select,.pathrow input{flex:1;min-width:0}
.pathrow .x{width:24px;height:24px;font-size:16px}
.pathrow .ord{display:flex;flex-direction:column}
.pathrow .ord button{border:0;background:none;padding:0;height:11px;line-height:10px;font-size:10px;color:var(--ink-3);cursor:pointer}
.pathrow .ord button:hover{color:var(--brand-navy)}
.counter{font-size:11px;color:var(--ink-3);text-align:right}
.counter.over{color:var(--bad)}
.jinfo .stepper{padding:0 0 8px;border-bottom:1px solid var(--line);gap:4px}
.jinfo .stepper button{flex:1;padding:6px 8px;font-size:12.5px;border:1px solid var(--line);border-radius:6px;justify-content:center;white-space:nowrap}

.chan-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chan-card{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink);cursor:pointer}
.chan-card .ic{width:28px;height:28px}
.chan-card .ic svg{width:16px;height:16px}

details summary{cursor:pointer}

.chip.ph:hover{background:#cdeff3}

.valbar .vi:hover{background:var(--bad);color:#fff}
/* diff */
.diff{display:grid;grid-template-columns:1fr 320px;flex:1;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.diff .side{border-left:1px solid var(--line);padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.diff .de{font-size:12.5px;background:#fff;border:1px solid var(--line);border-left-width:3px;border-radius:4px;padding:6px 8px}
.diff .de.added{border-left-color:var(--ok)}
.diff .de.removed{border-left-color:var(--bad)}
.diff .de.changed{border-left-color:var(--warn)}
.diff .de b{display:block;font-weight:500}
.legend2{display:flex;gap:12px;font-size:11.5px;color:var(--ink-2);align-items:center}

.legend2 .added i{background:#f1f8f1;border-color:var(--ok)}
.legend2 .removed i{background:var(--bad-soft);border-color:var(--bad)}
.legend2 .changed i{background:var(--sec-soft);border-color:var(--warn)}
/* monitor */
.mon{display:flex;flex-direction:column;flex:1;min-height:0;gap:12px}
.mon .canvas-wrap{border:1px solid var(--line);border-radius:6px}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:120px 18px 1fr;gap:0 10px;font-size:12.5px}

.tl .dot::before{content:"";position:absolute;left:7px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--brand-lilac);border:2px solid #fff;box-shadow:0 0 0 1px var(--brand-lilac)}
.tl .dot::after{content:"";position:absolute;left:10px;top:16px;bottom:-6px;width:2px;background:var(--line)}

.tl.k-sent .dot::before{background:var(--cta);box-shadow:0 0 0 1px var(--cta)}
.tl.k-opened .dot::before,.tl.k-clicked .dot::before{background:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.tl.k-skipped .dot::before{background:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.tl.k-waited .dot::before,.tl.k-now .dot::before{background:var(--sec);box-shadow:0 0 0 1px var(--sec)}
.tl.k-exited .dot::before,.tl.k-control .dot::before{background:var(--brand-navy);box-shadow:0 0 0 1px var(--brand-navy)}
.tl .tb{padding-bottom:12px}

.drawer-bg{position:fixed;inset:0;background:rgba(31,41,55,.25);z-index:55}

.vhist span:first-child{color:var(--ink-3);font-variant-numeric:tabular-nums}

<script>
'use strict';
/* =====================================================================================
   DATA — mock constants. Everything is generated by a seeded RNG, so the numbers are the
   same on every load; "Reset demo data" rebuilds it. Roadmap items are noted as [n].
   ===================================================================================== */
const NOW = new Date('2026-10-09T09:00:00Z');
const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const iso = ms => new Date(ms).toISOString();
const daysAgo = (d, h = 10) => { const t = new Date(NOW); t.setUTCDate(t.getUTCDate() - d); t.setUTCHours(h, 0, 0, 0); return t.toISOString(); };

function makeRng(seed) {
  let a = seed >>> 0;
  const next = () => { a += 0x6d2b79f5; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return { next, int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)), pick: arr => arr[Math.floor(next() * arr.length)], chance: p => next() < p };
}
function hash01(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }

/* [3] fixed event catalogue — no admin screen */
const EVENTS = [
  { id: 'order_abandoned', name: 'Order abandoned', description: 'A device order was started in the web shop and not completed.', payload: [
    { name: 'device_name', type: 'string', sample: 'Pixel 9a 128 GB' }, { name: 'cart_url', type: 'url', sample: 'https://shop.example.com/cart/8f2a1' }, { name: 'price', type: 'number', sample: '649.00' }] },
  { id: 'account_created', name: 'Account created', description: 'A new customer account was activated.', payload: [

  { id: 'device_back_in_stock', name: 'Device back in stock', description: 'A device a contact asked to be notified about is available again.', payload: [
    { name: 'device_name', type: 'string', sample: 'Galaxy S25 256 GB' }, { name: 'product_url', type: 'url', sample: 'https://shop.example.com/p/galaxy-s25' }] },
  { id: 'payment_failed', name: 'Payment failed', description: 'A recurring payment was declined.', payload: [
    { name: 'amount', type: 'number', sample: '42.50' }, { name: 'due_date', type: 'date', sample: '2026-10-15' }, { name: 'pay_url', type: 'url', sample: 'https://my.example.com/pay/7c31' }] },
  { id: 'plan_changed', name: 'Plan changed', description: 'A customer moved to another plan.', payload: [
    { name: 'old_plan', type: 'string', sample: 'Mobile 10 GB' }, { name: 'new_plan', type: 'string', sample: 'Mobile 40 GB' }] },

const eventById = id => EVENTS.find(e => e.id === id);
const CONTACT_FIELDS = ['first_name', 'last_name', 'email', 'phone', 'plan', 'language'];

/* dropdown-only lists — no pages */

  { id: 'off-free-month', name: 'One month free', code: 'FREE1M', link: 'https://my.example.com/offers/free1m' },

  { id: 'off-roaming', name: 'Roaming pass 50 % off', code: 'ROAM50', link: 'https://my.example.com/offers/roam50' },

const offerById = id => OFFERS.find(o => o.id === id);
const POLICIES = [
  { id: 'pol-default', name: 'Default contact policy', summary: 'Max 3 marketing messages / 7 days, quiet hours 21:00–08:00' },
  { id: 'pol-transactional', name: 'Transactional', summary: 'No frequency cap, no quiet hours' },

const userName = id => Object.values(USERS).find(u => u.id === id)?.name ?? id;

/* [4] ready-made content items: one channel, one language each; one default per channel.
   Placeholders: contact fields, event payload fields, offer_name / offer_code / offer_link. */
const em = (id, name, language, subject, preheader, body, isDefault = false) => ({ id, channel: 'email', name, language, isDefault, body: { subject, preheader, body } });
const sm = (id, name, language, text, isDefault = false) => ({ id, channel: 'sms', name, language, isDefault, body: { text } });
const pu = (id, name, language, title, text, link, isDefault = false) => ({ id, channel: 'push', name, language, isDefault, body: { title, text, link } });
const CONTENT_ITEMS = [
  em('c-generic-fr', 'Message générique', 'fr', 'Un message de votre fournisseur', 'Nouvelles de votre compte', 'Bonjour {{first_name}},\n\nNous avons une information pour vous concernant votre forfait {{plan}}.\n\nL’équipe', true),

  em('c-cart-new-fr', 'Panier – nouveau client', 'fr', 'Bienvenue {{first_name}} – terminez votre première commande', '{{device_name}} vous attend', 'Bonjour {{first_name}},\n\nVotre {{device_name}} ({{price}} $) est toujours dans votre panier. Comme nouveau client, profitez de {{offer_name}} avec le code {{offer_code}}.\n\n{{cart_url}}'),
  em('c-cart-new-en', 'Cart – new customer', 'en', 'Welcome {{first_name}} – finish your first order', '{{device_name}} is waiting', 'Hi {{first_name}},\n\nYour {{device_name}} ({{price}} $) is still in your cart. As a new customer, enjoy {{offer_name}} with code {{offer_code}}.\n\n{{cart_url}}'),
  em('c-cart-fr', 'Abandon – reminder FR', 'fr', 'Votre panier vous attend – {{device_name}}', 'Encore disponible au même prix', 'Bonjour {{first_name}},\n\nVotre {{device_name}} à {{price}} $ est réservé pendant 24 h.\n\nReprendre ma commande : {{cart_url}}'),
  em('c-cart-en', 'Abandon – reminder EN', 'en', 'Your cart is waiting – {{device_name}}', 'Still available at the same price', 'Hi {{first_name}},\n\nYour {{device_name}} at {{price}} $ is reserved for 24 h.\n\nResume my order: {{cart_url}}'),
  em('c-cart-old-fr', 'Abandon – reminder FR (old template)', 'fr', 'Vous avez oublié quelque chose – {{device_name}}', 'Toujours en stock', 'Bonjour {{first_name}},\n\nVotre {{device_name}} est toujours disponible.\n\n{{cart_url}}'),
  em('c-cart-old-en', 'Abandon – reminder EN (old template)', 'en', 'You left something behind – {{device_name}}', 'Still in stock', 'Hi {{first_name}},\n\nYour {{device_name}} is still available.\n\n{{cart_url}}'),
  em('c-stock-fr', 'Retour en stock', 'fr', '{{device_name}} est de retour en stock', 'Les quantités sont limitées', 'Bonjour {{first_name}},\n\nBonne nouvelle : {{device_name}} est de nouveau disponible.\n\nCommander : {{product_url}}'),
  em('c-stock-en', 'Back in stock', 'en', '{{device_name}} is back in stock', 'Quantities are limited', 'Hi {{first_name}},\n\nGood news: {{device_name}} is available again.\n\nOrder now: {{product_url}}'),
  em('c-welcome-fr', 'Bienvenue', 'fr', 'Bienvenue chez nous, {{first_name}} !', 'Votre forfait {{plan_name}} est actif', 'Bonjour {{first_name}},\n\nVotre forfait {{plan_name}} est actif depuis le {{activation_date}}. Pour bien commencer : {{offer_name}}.\n\nActiver mon cadeau : {{offer_link}}'),
  em('c-welcome-en', 'Welcome', 'en', 'Welcome aboard, {{first_name}}!', 'Your {{plan_name}} plan is active', 'Hi {{first_name}},\n\nYour {{plan_name}} plan has been active since {{activation_date}}. To get you started: {{offer_name}}.\n\nClaim my gift: {{offer_link}}'),
  em('c-payment-fr', 'Rappel de paiement', 'fr', 'Rappel : paiement de {{amount}} $ en attente', 'Évitez l’interruption de service', 'Bonjour {{first_name}},\n\nNous n’avons pas pu encaisser {{amount}} $. Mettez à jour votre mode de paiement avant le {{due_date}}.\n\n{{pay_url}}'),
  em('c-payment-en', 'Payment reminder', 'en', 'Reminder: {{amount}} $ payment pending', 'Avoid a service interruption', 'Hi {{first_name}},\n\nWe could not collect {{amount}} $. Update your payment method before {{due_date}}.\n\n{{pay_url}}'),
  em('c-roaming-fr', 'Promo itinérance', 'fr', 'Cet été, voyagez avec votre forfait {{new_plan}}', '{{offer_name}}', 'Bonjour {{first_name}},\n\nAvec {{new_plan}}, profitez de {{offer_name}} jusqu’au 31 août. Code : {{offer_code}}\n\n{{offer_link}}'),

  sm('s-generic-fr', 'SMS générique', 'fr', '{{first_name}}, un message de votre fournisseur concernant votre forfait {{plan}}.', true),

    const rankPos = 24 + d * (rankSize + GAP_RANK), crossPos = 24 + c * (crossSize + GAP_CROSS);
    const x = orientation === 'LR' ? rankPos : crossPos + (NW - s.w) / 2, y = orientation === 'LR' ? crossPos + (NH + extraH - s.h) / 2 : rankPos;
    pos[n.id] = { x, y, w: s.w, h: s.h }; width = Math.max(width, x + s.w + 24); height = Math.max(height, y + s.h + 24);

}
/* cubic connector between two boxes; split outlets fan out along the exit side */
function edgePath(a, b, orientation, index, count, cardH) {
  const spread = size => count <= 1 ? 0 : ((index + 1) / (count + 1) - 0.5) * size * 0.9;
  const ah = Math.min(a.h, cardH), bh = Math.min(b.h, cardH);
  let x1, y1, x2, y2;
  if (orientation === 'LR') { x1 = a.x + a.w; y1 = a.y + ah / 2 + spread(ah); x2 = b.x; y2 = b.y + bh / 2; }
  else { x1 = a.x + a.w / 2 + spread(a.w); y1 = a.y + a.h; x2 = b.x + b.w / 2; y2 = b.y; }
  const dx = x2 - x1, dy = y2 - y1;
  const c1 = orientation === 'LR' ? [x1 + dx * .5, y1] : [x1, y1 + dy * .5], c2 = orientation === 'LR' ? [x2 - dx * .5, y2] : [x2, y2 - dy * .5];
  const at = t => { const m = 1 - t; return { x: m * m * m * x1 + 3 * m * m * t * c1[0] + 3 * m * t * t * c2[0] + t * t * t * x2, y: m * m * m * y1 + 3 * m * m * t * c1[1] + 3 * m * t * t * c2[1] + t * t * t * y2 }; };
  return { d: `M${x1},${y1} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${x2},${y2}`, mid: at(.5), at };
}

      if (l.event === 'entered') o.entered++; else if (l.event === 'sent') o.sent++; else if (l.event === 'skipped') o.skipped++; else if (l.event === 'opened') o.opened++; else if (l.event === 'clicked') o.clicked++; else if (l.event === 'control') o.control++; else if (l.event === 'split') o.paths[l.label] = (o.paths[l.label] ?? 0) + 1; }

function rowMenu(el, jid) {
  document.querySelectorAll('.menu.rowmenu').forEach(m => m.remove());
  const m = document.createElement('div'); m.className = 'menu rowmenu'; m.style.right = '12px'; m.style.top = '44px';
  m.innerHTML = `<button data-act="open-journey" data-arg="${jid}">${icon('journeys')} Open editor</button><button data-act="go-monitor" data-arg="${jid}">${icon('monitor')} Open Monitor</button><button data-act="duplicate" data-arg="${jid}">${icon('copy')} Duplicate</button>`;
  el.parentElement.appendChild(m);
  setTimeout(() => document.addEventListener('click', () => m.remove(), { once: true }), 0);
}
/* "+ New journey" (modal): name, event, single / batch, contact list → editor with Event entry + Exit, v1 Draft */
function newJourneyModal() {
  openModal(modalHtml('New journey', `
    <div class="fld"><label class="req" for="nj-name">Name</label><input id="nj-name" placeholder="e.g. Device order abandonment" autofocus></div>
    <div class="fld"><label for="nj-event">Event <small class="muted">— every journey starts from an event</small></label><select id="nj-event">${EVENTS.map(e => `<option value="${e.id}">${esc(e.name)} · ${e.id}</option>`).join('')}</select><small class="muted" id="nj-hint"></small></div>
    <div class="form2" style="padding:0">
      <div class="fld"><label>Entry</label><div class="seg" id="nj-mode"><button class="on" data-mode="single" type="button">Single</button><button data-mode="batch" type="button">Batch</button></div><small class="muted" id="nj-mode-hint">One contact per API call.</small></div>
      <div class="fld"><label>Contact list</label><div class="seg" id="nj-list"><button class="on" data-list="Customers" type="button">Customers</button><button data-list="Prospects" type="button">Prospects</button></div></div>
    </div>`, `<button class="btn outline" data-act="modal-close">Cancel</button><button class="btn primary" id="nj-create" disabled>Create journey</button>`));
  const hint = () => { const e = eventById($('nj-event').value); $('nj-hint').textContent = `${e.description} Payload: ${e.payload.map(p => p.name).join(', ')}.`; };
  hint(); $('nj-event').onchange = hint;
  $('nj-name').oninput = () => { $('nj-create').disabled = !$('nj-name').value.trim(); };
  $('nj-name').onkeydown = e => { if (e.key === 'Enter' && $('nj-name').value.trim()) $('nj-create').click(); };
  for (const id of ['nj-mode', 'nj-list']) $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); if (id === 'nj-mode') $('nj-mode-hint').textContent = b.dataset.mode === 'single' ? 'One contact per API call.' : 'Many contacts per API call. Batch entry is API only — no file upload.'; });
  $('nj-create').onclick = () => {
    const { j, v } = createJourney({ name: $('nj-name').value.trim(), eventId: $('nj-event').value, entryMode: $('nj-mode .on, #nj-mode .on').dataset.mode, contactList: $('nj-list .on, #nj-list .on').dataset.list });
    closeModal(); toast('Journey created', 'Event entry and Exit are already placed. Add steps on the connection between them.');
    openEditor(j.id, v.id, v.steps[0].id);
  };
  setTimeout(() => $('nj-name').focus(), 30);
}

/* ---- step (a) placeholders; replaced in steps (c)–(e) ---- */
function renderEditor() { crumb([{ label: 'Journeys', act: 'go-journeys' }, { label: curJourney()?.name ?? '' }]); $('view-editor').innerHTML = `<div class="card"><div class="card-h"><h2>${esc(curJourney()?.name ?? '')}</h2></div></div>`; }
function renderMonitor() { crumb([{ label: 'Journey Monitor' }]); $('view-monitor').innerHTML = `<div class="card"><div class="card-h"><h2>Journey Monitor</h2></div></div>`; }
function fitCanvas() {}

/* ---- global event delegation: every control carries data-act ---- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  if (act === 'modal-close') { closeModal(el.closest('.modal-bg').id); return; }
  if (act === 'go-journeys') { showView('journeys'); return; }
  if (act === 'go-editor') { openEditor(arg, el.dataset.v || undefined); return; }
  if (act === 'go-monitor') { openMonitor(arg); return; }
  if (act === 'list-tab') { app.list.tab = arg; renderJourneyList(); return; }
  if (act === 'new-journey') { newJourneyModal(); return; }
  if (act === 'row-menu') { e.stopPropagation(); rowMenu(el, arg); return; }
  if (act === 'open-journey') { if (e.target.closest('[data-stop]') && el.tagName === 'TR') return; openEditor(el.dataset.jid ?? arg, el.dataset.v || undefined); return; }
  if (act === 'duplicate') { const j = JOURNEYS.find(x => x.id === arg); const c = duplicateJourney(j); toast('Journey duplicated', `“${c.name}” created as a draft.`); app.list.tab = 'draft'; renderJourneyList(); return; }
  if (typeof handleAct === 'function') handleAct(act, arg, el, e);
});
document.querySelectorAll('.nav button[data-view]').forEach(b => b.addEventListener('click', () => { if (b.dataset.view === 'monitor') openMonitor(app.journeyId ?? app.monitor.journeyId); else showView('journeys'); }));
document.querySelectorAll('.nav button .nl').forEach(l => l.parentElement.title = l.textContent.trim());
$('btn-nav').onclick = () => { const closed = document.querySelector('.app').classList.toggle('nav-closed'); $('btn-nav').classList.toggle('on', closed); $('btn-nav').title = closed ? 'Expand menu' : 'Collapse menu'; setTimeout(fitCanvas, 170); };
$('role-sel').onchange = e => applyRole(e.target.value);
$('btn-reset').onclick = () => { resetDemo(); app.journeyId = null; app.versionId = null; app.selectedStepId = null; app.monitor.journeyId = null; showView('journeys'); toast('Demo data reset', 'Every change made in this session was discarded.'); };

/* boot */
applyRole('marketer');
showView('journeys');
</script>
</body>
