<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETIYA Marketing Cloud · Journeys</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23F58220'/%3E%3Crect x='6' y='6' width='12' height='12' rx='1' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================================
   1. CSS copied from CM-New-UI-UX2 (index.html, v48): tokens, shell, components, journey
   builder, monitor, toast, modal, footer, campaign stepper, visual pass. Same class names.
   ===================================================================================== */
/* Single-theme by design: Etiya commercial palette — navy primary, dark-orange accent, neutral greys. --green keeps its variable name for compatibility but now carries the navy primary; status greens live in --ok. */
:root{
  /* ---- Etiya brand kit ------------------------------------------------
     Primary  Dark Blue & Lilac  #242441 / #5D5D8D
     Secondary Orange            #F58220 / #F9AA56   — accent and tint only
     Complimentary Turquoise     #00B5CB / #37DBDF   — action
     Grey                        #DFE1DF / #EBECEB
     Historical variable names are kept so the rest of the CSS keeps working;
     only their values changed. See docs/brand.md. */
  --brand-navy:#242441; --brand-lilac:#5D5D8D; --brand-lilac-line:#4E4E7A; --brand-nav-hover:#2E2E52;
  /* Chrome surfaces (decision V7): the lilac as a translucent wash over the page instead of a
     solid dark block, so the menu and the bars stop pulling the eye. Dark ink on all of them. */
  --bar-bg:rgba(93,93,141,.14); --nav-bg:rgba(93,93,141,.08); --nav-hover:rgba(93,93,141,.12); --nav-active:rgba(93,93,141,.22); --chrome-line:rgba(93,93,141,.28);
  --sec:#F58220; --sec-light:#F9AA56; --sec-ink:#9E560D; --sec-soft:#FDF0E2;
  --cta:#00818F; --cta-hover:#00707E; --cta-bright:#00B5CB; --cta-light:#37DBDF; --cta-soft:#E2F6F8;
  --grey-1:#DFE1DF; --grey-2:#EBECEB;

  --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#F7F7F9; --ink:#242441; --ink-2:#4A4A60; --ink-3:#6B6B80;
  --line:#DFE1DF; --line-2:#EBECEB;
  --green:#242441; --green-ink:#1A1A33; --green-soft:#ECECF3; --grey-btn:#5A5A70; --dark-btn:#3F3F72;
  --orange:#F58220; --orange-ink:#9E560D; --orange-soft:#FDF0E2;
  --ok:#2A7230; --ok-soft:#E8F3E8; --warn:#9E560D; --warn-soft:#FDF0E2; --bad:#C62828; --bad-soft:#FBE9E9; --acc:#00818F; --acc-soft:#E2F6F8;
  /* journey step tints — re-toned into the brand families, dark ink on each */
  --t-entry:#E2F6F8; --t-entry-i:#00707E;
  --t-delivery:#ECECF3; --t-delivery-i:#242441;
  --t-timer:#FDF0E2; --t-timer-i:#9E560D;
  --t-wait:#E6F4F1; --t-wait-i:#0F7566;
  --t-cond:#E8E6F4; --t-cond-i:#4A4A8C;
  --t-offer:#FBE6D2; --t-offer-i:#9E560D;
  --t-par:#EBECEB; --t-par-i:#5A5A70;
  --t-exit:#DFF2F5; --t-exit-i:#00707E;
  --t-call:#E4E2F0; --t-call-i:#3F3F72;
  --t-ext:#E9F3F5; --t-ext-i:#2A6B78;
  --t-nbo:#DDF1EE; --t-nbo-i:#0B6B5E;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Roboto',system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
  --shadow:0 1px 3px rgba(36,36,65,.07),0 2px 10px rgba(36,36,65,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.43;color-scheme:light}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cta-bright);outline-offset:1px;box-shadow:0 0 0 3px rgba(0,181,203,.35)}
.app{display:grid;grid-template-columns:210px 1fr;grid-template-rows:56px 1fr auto;height:100vh;min-height:680px}
/* top bar */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--bar-bg);border-bottom:1px solid var(--chrome-line);color:var(--ink)}
.logo{display:flex;align-items:center;gap:8px}
.logo .mark{width:22px;height:22px;background:var(--sec);border-radius:3px;position:relative}
.logo .mark::after{content:"";position:absolute;left:5px;top:5px;width:12px;height:12px;background:#fff;opacity:.9;border-radius:1px}
.logo .w{display:flex;flex-direction:column;line-height:1}
.logo .w b{font-size:15px;letter-spacing:.06em;color:var(--brand-navy);font-weight:500}
.logo .w small{font-size:8.5px;letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase}
.burger{width:32px;height:32px;border:1px solid var(--chrome-line);border-radius:50%;background:none;display:grid;place-items:center;margin-left:8px}
.burger i{display:block;width:14px;height:2px;background:var(--brand-navy);box-shadow:0 -4px 0 var(--brand-navy),0 4px 0 var(--brand-navy)}
.tright{margin-left:auto;display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid var(--chrome-line);border-radius:4px;overflow:hidden;color:var(--ink);background:var(--surface)}
.lang span{padding:5px 10px;font-weight:600;font-size:12px}
.lang span+span{border-left:1px solid var(--line);color:var(--ink-2)}
.avatar{display:flex;align-items:center;gap:8px}
.avatar .a{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#F9AA56,#F58220)}
.avatar .n{display:flex;flex-direction:column;line-height:1.15}
.avatar .n b{font-weight:600;font-size:12.5px}
.avatar .n small{color:var(--ink-2);font-size:11px}
.proto{display:flex;align-items:center;gap:8px}
.topbar .pill{background:var(--surface);border-color:var(--chrome-line);color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap;color:var(--ink-2)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--acc-soft);color:var(--cta-hover);border-color:transparent}
/* nav */
.nav{background:var(--nav-bg);border-right:1px solid var(--chrome-line);padding:14px 0;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav .grp{font-size:11px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:12px 16px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--ink);padding:8px 16px 8px 13px;font-size:13px}
.nav button:hover{background:var(--nav-hover);color:var(--brand-navy)}
.nav button.active{background:var(--nav-active);border-left-color:var(--sec);color:var(--brand-navy);font-weight:600}
.nav button[disabled]{cursor:default}
.nav button svg{width:15px;height:15px;stroke:var(--ink-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button.new svg{stroke:var(--sec-ink)}
.nav .foot{margin-top:auto;padding:12px 16px;font-size:11px;color:var(--ink-2);line-height:1.5}
/* collapsible main menu: burger toggles; collapsed = icon rail with tooltips */
.app{transition:grid-template-columns .15s}
.app.nav-closed{grid-template-columns:60px 1fr}
.app.nav-closed .nav{padding:10px 0}
.app.nav-closed .nav .grp{height:1px;padding:0;margin:8px 14px;background:var(--chrome-line);overflow:hidden;font-size:0}
.app.nav-closed .nav .grp:first-child{display:none}
.app.nav-closed .nav button{justify-content:center;padding:10px 0 10px 0;border-left-width:3px;font-size:0;gap:0}
.app.nav-closed .nav button svg{width:18px;height:18px;margin-left:-3px}
.app.nav-closed .nav button.active svg{stroke:var(--brand-navy)}
.app.nav-closed .nav .foot{display:none}
.nav button .nl{white-space:nowrap}
.burger.on{background:var(--nav-active);border-color:var(--brand-lilac)}
/* main */
.main{overflow:hidden;display:flex;flex-direction:column;min-width:0}
.crumb{padding:12px 24px 0;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.crumb b{color:var(--ink-3);font-weight:400;margin:0 6px}
.view{display:none;flex:1;min-height:0;flex-direction:column;padding:12px 24px 16px;gap:12px}
.view.active{display:flex}
.card{background:var(--surface);border-radius:6px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px 8px}
.card-h h2{margin:0;font-size:18px;font-weight:400;color:var(--green);white-space:nowrap}
.card-h p{margin:0;color:var(--ink-2);font-size:12.5px;flex-basis:100%}
.card-h .grow{flex:1}
.plus{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--green);color:var(--green);background:none;display:grid;place-items:center;font-size:18px;line-height:1}
.btn{border:1px solid transparent;background:var(--surface-2);padding:7px 14px;border-radius:4px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn.primary{background:var(--cta);color:#fff}
.btn.primary:hover{background:var(--cta-hover)}
.btn.grey{background:var(--grey-btn);color:#fff}
.btn.dark{background:var(--dark-btn);color:#fff}
.btn.outline{background:none;border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:var(--surface-2);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--surface-2)}
.tbl tr.sel td{background:var(--cta-soft)}
.tbl a,.lnk{color:var(--cta-hover);text-decoration:none;font-weight:500}
.mono{font-family:var(--mono);font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:1fr 340px;gap:12px;flex:1;min-height:0}
.split > .left{overflow:auto;min-width:0;display:flex;flex-direction:column}
.panel{overflow:auto;display:flex;flex-direction:column;min-width:0}
.panel .ph{padding:16px 20px 6px;display:flex;align-items:center;gap:8px}
.panel .ph h3{margin:0;font-size:17px;font-weight:400;color:var(--green)}
.panel .ph .x{margin-left:auto}
.panel .pb{padding:8px 20px 16px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--ink-2)}
.fld label.req::after,.h4 .req::after{content:" *";color:var(--bad)}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:12.5px;width:100%}
.fld input[readonly],.fld textarea[readonly]{background:var(--surface-2)}
.fld textarea{min-height:64px;resize:vertical;font-family:var(--mono);font-size:11.5px}
.fld .row{display:flex;gap:6px}
.fld .row > *{flex:1}
.sec{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-top:8px;border-top:1px solid var(--line-2);margin-top:2px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:1px 7px;font-size:11.5px}
.tag-path{display:flex;flex-wrap:wrap;align-items:center;gap:3px;font-size:12px}
.tag-path .sep{color:var(--ink-3)}
.note{background:var(--warn-soft);border-radius:4px;padding:8px 10px;font-size:12px;color:var(--sec-ink)}
.empty{color:var(--ink-3);padding:24px;text-align:center}
/* journey builder */
.jb{display:grid;grid-template-columns:120px 1fr;flex:1;min-height:0;transition:grid-template-columns .15s}
.jb.pal-closed{grid-template-columns:44px 1fr}
.palette{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.palette .pt{font-weight:600;font-size:13px;display:flex;align-items:center}
.palette .pt .tog{margin-left:auto}
.tog{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;display:grid;place-items:center;color:var(--ink-2);padding:0}
.tog i{display:block;width:12px;height:2px;background:currentColor;box-shadow:0 -4px 0 currentColor,0 4px 0 currentColor}
.jb.pal-closed .palette{padding:10px 6px;align-items:center}
.jb.pal-closed .palette .pt span,.jb.pal-closed .palette .ps{display:none}
.jb.pal-closed .palette .pt .tog{margin:0}
.jb.pal-closed .palette button:not(.tog){width:32px;height:32px;padding:0;justify-content:center;border-radius:6px}
.jb.pal-closed .palette button:not(.tog) i{width:auto;height:auto;background:none;font-size:13px}
.jb.pal-closed .palette button:not(.tog) span{display:none}
.palette .ps{font-size:10.5px;color:var(--ink-3);margin-top:-6px;margin-bottom:4px}
.palette button{display:flex;align-items:center;gap:7px;border:1px solid var(--c);background:var(--surface);color:var(--c);padding:8px 8px;border-radius:5px;text-align:left;font-size:11.5px;font-weight:600}
.palette button:hover{background:var(--bg2)}
.palette button:not(.tog) i{width:18px;height:18px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:10px;font-style:normal;flex:none}
.cright{display:flex;flex-direction:column;min-width:0}
.ctool{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ctool .ic{width:28px;height:28px;border:0;background:none;border-radius:4px;display:grid;place-items:center;color:var(--ink-2)}
.ctool .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ctool .ic.on{border:1.5px solid var(--green);color:var(--green)}
.ctool .grow{flex:1}
.ctool.evbar{background:var(--surface-2);flex-wrap:wrap}
.ctool.evbar select{border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:#fff}
.ctool .dir{display:flex;border-radius:4px;overflow:hidden}
.ctool .dir button{border:0;background:var(--green);color:#fff;width:30px;height:28px;display:grid;place-items:center}
.ctool .dir button+button{background:var(--brand-lilac)}
.ctool .dir svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.canvas-wrap{position:relative;flex:1;overflow:hidden;background:var(--surface);min-height:420px;
  background-image:linear-gradient(var(--line-2) 1px,transparent 1px),linear-gradient(90deg,var(--line-2) 1px,transparent 1px);background-size:24px 24px;cursor:grab;touch-action:none}
.canvas-wrap.panning{cursor:grabbing}
svg.canvas{display:block;width:100%;height:100%;user-select:none}
.node rect.body{fill:#fff;stroke:var(--line);stroke-width:1;rx:6;filter:drop-shadow(0 2px 6px rgba(31,41,55,.08))}
.node.sel rect.body{stroke:var(--cta-bright);stroke-width:2}
.node.lit rect.body{stroke:var(--orange);stroke-width:3;filter:drop-shadow(0 0 8px rgba(242,107,29,.7))}
.node.done rect.body{stroke:var(--brand-lilac);stroke-width:2}
.node.cur rect.body{stroke:var(--sec);stroke-width:3;filter:drop-shadow(0 0 8px rgba(245,130,32,.55));animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.45}}
.edge.taken path{stroke:var(--green);stroke-width:2.5;stroke-dasharray:none}
.edge.taken rect{stroke:var(--green)}
.node rect.head{rx:6}
.node rect.head2{}
.node text{font-family:var(--sans)}
.node text.t{font-size:12px;font-weight:600}
.node text.k{font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.node text.id{font-size:9px;fill:var(--ink-3);font-family:var(--mono)}
.node text.lab{font-size:10px;fill:var(--ink-2)}
.nsel{width:100%;height:100%}
.nname{width:100%;height:100%}
.nname input{width:100%;height:100%;border:1px solid transparent;border-radius:4px;background:transparent;font:600 12px var(--sans);color:var(--ink);padding:0 4px}
.nname input:hover{border-color:var(--line);background:#fff}
.nname input:focus{outline:none;border-color:var(--orange);background:#fff}
.nsel select{width:100%;height:100%;border:1px solid var(--line);border-radius:4px;background:#fff;font:11px var(--sans);color:var(--ink);padding:0 6px;cursor:pointer}
.nsel select:focus{outline:2px solid var(--orange);outline-offset:0}
.node .badge circle{fill:var(--sec);stroke:#fff;stroke-width:2}
.node .badge text{font-size:10px;fill:#fff;font-weight:700;font-family:var(--mono)}
.node circle.port{fill:#fff;stroke:var(--ink-3);stroke-width:1.5}
.node circle.port.out{fill:var(--orange);stroke:var(--orange)}
.edge path{fill:none;stroke:#9B9BB0;stroke-width:1.5;stroke-dasharray:4 3}
.edge text{font-size:10px;fill:var(--ink-2);font-family:var(--sans);font-weight:600}
.edge rect{fill:#fff;stroke:var(--line)}
.legend{position:absolute;right:12px;bottom:12px;font-size:11px;color:var(--ink-3);background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 9px}
/* monitor */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 20px 6px}
.stat{background:var(--surface-2);border-radius:6px;padding:10px 12px}
.stat .l{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:28px;margin-top:2px;color:var(--ink)}
.stat .s{font-size:11.5px;color:var(--ink-2)}
.funnel{display:flex;flex-direction:column;gap:6px;padding:0 20px 8px}
.frow{display:grid;grid-template-columns:210px 1fr 50px;gap:10px;align-items:center;font-size:12.5px}
.frow .bar{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.frow .bar i{display:block;height:100%}
.frow .n{text-align:right;font-variant-numeric:tabular-nums}
.toolrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 20px 10px}
.toolrow select{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.toolrow input[type=range]{width:220px;accent-color:var(--cta)}
.h4{font-size:13px;font-weight:600;color:var(--ink);padding:12px 20px 6px}
.log{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border-radius:6px;padding:8px 10px;max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:3px}
.log div{white-space:pre-wrap}
.log .t{color:var(--ink-3)}
.log .ok{color:var(--ok)} .log .warn{color:var(--warn)} .log .bad{color:var(--bad)} .log .acc{color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px 16px}
.padx{padding:0 20px 16px}
#jsel{max-width:300px;text-overflow:ellipsis}
.ctool{flex-wrap:wrap}
#jtable td:first-child{white-space:nowrap}

/* api */
.api{display:grid;grid-template-columns:280px 1fr;gap:12px;flex:1;min-height:0;padding:0 20px 16px}
.api .list{display:flex;flex-direction:column;gap:6px}
.api .list button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.api .list button.active{border-color:var(--cta);background:var(--cta-soft)}
.api .list .m{font-family:var(--mono);font-size:11px;color:var(--green-ink);font-weight:500}
pre.code{margin:0;background:var(--brand-navy);color:#E6E6F0;border-radius:6px;padding:12px 14px;font-family:var(--mono);font-size:11.5px;overflow:auto;line-height:1.5}
/* toast */
.toast{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast div{background:#fff;border-left:4px solid var(--green);box-shadow:var(--shadow);border-radius:6px;padding:10px 14px;font-size:12.5px;max-width:420px;animation:tin .2s ease-out}
.toast div.warn{border-left-color:var(--warn)} .toast div.bad{border-left-color:var(--bad)}

<script>
'use strict';
/* =====================================================================================
   DATA — mock constants. Everything is generated by a seeded RNG, so the numbers are the
   same on every load; "Reset demo data" rebuilds it. Roadmap items are noted as [n].
   ===================================================================================== */
const NOW = new Date('2026-10-09T09:00:00Z');
const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const iso = ms => new Date(ms).toISOString();
const daysAgo = (d, h = 10) => { const t = new Date(NOW); t.setUTCDate(t.getUTCDate() - d); t.setUTCHours(h, 0, 0, 0); return t.toISOString(); };

function makeRng(seed) {
  let a = seed >>> 0;
  const next = () => { a += 0x6d2b79f5; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return { next, int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)), pick: arr => arr[Math.floor(next() * arr.length)], chance: p => next() < p };
}
function hash01(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }

/* [3] fixed event catalogue — no admin screen */
const EVENTS = [
  { id: 'order_abandoned', name: 'Order abandoned', description: 'A device order was started in the web shop and not completed.', payload: [
    { name: 'device_name', type: 'string', sample: 'Pixel 9a 128 GB' }, { name: 'cart_url', type: 'url', sample: 'https://shop.example.com/cart/8f2a1' }, { name: 'price', type: 'number', sample: '649.00' }] },
  { id: 'account_created', name: 'Account created', description: 'A new customer account was activated.', payload: [
    { name: 'plan_name', type: 'string', sample: 'Mobile 20 GB' }, { name: 'activation_date', type: 'date', sample: '2026-10-08' }] },
  { id: 'device_back_in_stock', name: 'Device back in stock', description: 'A device a contact asked to be notified about is available again.', payload: [
    { name: 'device_name', type: 'string', sample: 'Galaxy S25 256 GB' }, { name: 'product_url', type: 'url', sample: 'https://shop.example.com/p/galaxy-s25' }] },
  { id: 'payment_failed', name: 'Payment failed', description: 'A recurring payment was declined.', payload: [
    { name: 'amount', type: 'number', sample: '42.50' }, { name: 'due_date', type: 'date', sample: '2026-10-15' }, { name: 'pay_url', type: 'url', sample: 'https://my.example.com/pay/7c31' }] },
  { id: 'plan_changed', name: 'Plan changed', description: 'A customer moved to another plan.', payload: [
    { name: 'old_plan', type: 'string', sample: 'Mobile 10 GB' }, { name: 'new_plan', type: 'string', sample: 'Mobile 40 GB' }] },
  { id: 'order_completed', name: 'Order completed', description: 'A device order was paid and confirmed.', payload: [
    { name: 'order_id', type: 'string', sample: 'ORD-48213' }, { name: 'amount', type: 'number', sample: '649.00' }] },
];
const WEEKDAYS = [[1, 'Mon'], [2, 'Tue'], [3, 'Wed'], [4, 'Thu'], [5, 'Fri'], [6, 'Sat'], [0, 'Sun']];
const dayName = d => WEEKDAYS.find(w => w[0] === d)?.[1] ?? '';
const daysLabel = days => { const k = [...days].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)); if (k.length === 7) return 'every day'; if (k.join() === '1,2,3,4,5') return 'Mon–Fri'; if (k.join() === '1,2,3,4,5,6') return 'Mon–Sat'; return k.map(dayName).join(', '); };
const eventById = id => EVENTS.find(e => e.id === id);
const CONTACT_FIELDS = ['first_name', 'last_name', 'email', 'phone', 'plan', 'language'];
const OFFER_FIELDS = ['offer_name', 'offer_code', 'offer_link'];

/* dropdown-only lists — no pages */
const SEGMENTS = [
  { id: 'seg-lang-fr', name: 'Langue Français', description: 'Contact language = FR' },
  { id: 'seg-lang-en', name: 'Langue English', description: 'Contact language = EN' },
  { id: 'seg-fr-today', name: 'Français + account created today', description: 'Language FR and activation date = today' },
  { id: 'seg-en-today', name: 'English + account created today', description: 'Language EN and activation date = today' },
  { id: 'seg-account-today', name: 'Account created today', description: 'Activation date = today' },
  { id: 'seg-high-value', name: 'High-value customers', description: 'Monthly spend above 60 $' },
  { id: 'seg-prepaid', name: 'Prepaid plans', description: 'Any prepaid plan' },
  { id: 'seg-multi-line', name: 'Multi-line accounts', description: 'Two or more lines on the account' },
  { id: 'seg-recent-device', name: 'Bought a device in the last 90 days', description: 'Device order completed < 90 d' },
];
const segById = id => SEGMENTS.find(s => s.id === id);
/* contact lists = existing datamarts (catalogue is admin-owned; only the names are needed here) */
const DATAMARTS = [
  { id: 'DM-1', name: 'MAIN DATAMART', type: 'Customers', desc: 'One row per subscriber — profile, plan, usage, scores.', kind: 'Customers' },
  { id: 'DM-3', name: 'PROSPECT DATAMART', type: 'Prospects', desc: 'Leads and web-shop visitors who are not customers yet.', kind: 'Prospects' },
  { id: 'DM-4', name: 'DEVICE WAITLIST', type: 'Prospects', desc: 'Prospects who asked to be notified about a device.', kind: 'Prospects', filter: c => !!c.pushToken || !!c.phone },
  { id: 'DM-5', name: 'HOME INTERNET DATAMART', type: 'Customers', desc: 'Subscribers with a Home Internet or bundle plan.', kind: 'Customers', filter: c => /Home/.test(c.plan) },
];
const dmById = id => DATAMARTS.find(d => d.id === id) ?? DATAMARTS[0];
const dmName = id => dmById(id).name;
const contactsOf = id => { const d = dmById(id); return CONTACTS.filter(c => c.kind === d.kind && (!d.filter || d.filter(c))); };
const OFFERS = [
  { id: 'off-10-off', name: '10 $ off next device', code: 'DEV10', link: 'https://shop.example.com/offers/dev10' },
  { id: 'off-free-month', name: 'One month free', code: 'FREE1M', link: 'https://my.example.com/offers/free1m' },
  { id: 'off-5gb', name: '+5 GB for 3 months', code: 'PLUS5GB', link: 'https://my.example.com/offers/plus5gb' },
  { id: 'off-roaming', name: 'Roaming pass 50 % off', code: 'ROAM50', link: 'https://my.example.com/offers/roam50' },
];
const offerById = id => OFFERS.find(o => o.id === id);
const POLICIES = [
  { id: 'pol-default', name: 'Default contact policy', summary: 'Max 3 marketing messages / 7 days, quiet hours 21:00–08:00' },
  { id: 'pol-transactional', name: 'Transactional', summary: 'No frequency cap, no quiet hours' },
  { id: 'pol-light', name: 'Light touch', summary: 'Max 1 marketing message / 7 days' },
];
const policyById = id => POLICIES.find(p => p.id === id);
const USERS = { marketer: { id: 'u-marketer', name: 'Marie Tremblay', title: 'Campaign marketer' }, approver: { id: 'u-approver', name: 'Daniel Roy', title: 'Campaign approver' } };
const userName = id => Object.values(USERS).find(u => u.id === id)?.name ?? id;
const ROLE_NAMES = { marketer: 'Marketer', approver: 'Approver' };

/* [4] ready-made content items: one channel, one language each; one default per channel.
   Placeholders: contact fields, event payload fields, offer_name / offer_code / offer_link. */
const em = (id, name, language, subject, preheader, body, isDefault = false) => ({ id, channel: 'email', name, language, isDefault, body: { subject, preheader, body } });
const sm = (id, name, language, text, isDefault = false) => ({ id, channel: 'sms', name, language, isDefault, body: { text } });
const pu = (id, name, language, title, text, link, isDefault = false) => ({ id, channel: 'push', name, language, isDefault, body: { title, text, link } });
const CONTENT_ITEMS = [

function generateContacts() {

/* one commit for card and panel: both edit the same step, then the editor re-renders */
function commitStepField(j, v, s, path, val, el) {
  const setPath = (obj, p, x) => { const parts = p.split('.'); let o = obj; for (const q of parts.slice(0, -1)) o = o[q]; o[parts[parts.length - 1]] = x; };
  if (path === 'journey.contactList') { j.contactList = val; j.testUsers = j.testUsers.filter(id => contactsOf(j.contactList).some(c => c.id === id)); touch(j); renderEditor(); return; }

    const AUTO = ['Wait', 'Wait until', 'Wait for event', 'Wait for segment']; if (AUTO.includes(s.name)) s.name = AUTO[['duration', 'until', 'event', 'segment'].indexOf(val)];
    touch(j); renderEditor(); return;
  }
  if (path.startsWith('config.window.') || path === 'config.window') { // send window
    if (path === 'config.window') s.config.window = val ? { from: '09:00', to: '20:00', days: [1, 2, 3, 4, 5] } : null; else if (s.config.window) { const k = path.split('.')[2]; s.config.window[k] = val; }
    touch(j); renderEditor(); return;
  }
  if (path === 'config.weekdays' || path === 'config.window.days') { touch(j); renderEditor(); return; }
  setPath(s, path, val === '' && path.endsWith('Id') ? null : val);
  if (s.type === 'segmentSplit') { // rename the edge that carried the old segment key
    const keys = outletsOf(s).map(o => o.key); v.edges.filter(e => e.from === s.id).forEach((e, _, arr) => { if (!keys.includes(e.label)) { const free = keys.find(k => k !== 'Remaining' && !arr.some(x => x.label === k)); if (free) e.label = free; } }); syncEdges(v, s);

}
/* bind the panel's inputs: data-bind="path" sets a field on the step; data-set/data-val for segmented buttons; data-sub for the stepper */
function wireStepPanel(j, v) {
  const panel = $('jpanel'), s = app.selectedStepId ? stepOf(v, app.selectedStepId) : null; if (!panel || !s) return;
  const commit = (path, val, el) => commitStepField(j, v, s, path, val, el);
  panel.querySelectorAll('[data-bind]').forEach(el => {
    const ev = el.tagName === 'INPUT' && (el.type === 'text' || !el.type || el.type === 'number') ? 'change' : 'change';
    el.addEventListener(ev, () => { let val = el.type === 'checkbox' ? el.checked : el.value; if (el.dataset.type === 'number') val = Math.max(0, Number(val) || 0); commit(el.dataset.bind, val, el); });
    if (el.tagName === 'INPUT' && el.type !== 'checkbox') el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });

  panel.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => commit(b.dataset.set, b.dataset.val)));

/* editor actions (delegated through data-act) */
function handleAct(act, arg, el, e) {
  const j = curJourney(), v = curVersion(), s = app.selectedStepId && v ? stepOf(v, app.selectedStepId) : null;
  switch (act) {
    case 'zoom-in': zoomCanvas('cwrap', 1.2); return;
    case 'zoom-out': zoomCanvas('cwrap', 1 / 1.2); return;
    case 'fit': fitCanvasOf('cwrap'); return;
    case 'orient': j.orientation = arg; canvasFor('cwrap').fitted = false; renderEditor(); return;
    case 'autolayout': for (const st of v.steps) if (st.pos) delete st.pos[j.orientation]; touch(j); canvasFor('cwrap').fitted = false; renderEditor(); return;
    case 'select-step': app.selectedStepId = arg || null; renderEditor(); return;
    case 'validate': { const issues = validateVersion(v); toast(issues.length ? `${issues.length} issue${issues.length === 1 ? '' : 's'} found` : 'Valid', issues.length ? issues.map(i => '• ' + i.message).join('\n') : 'The journey is ready to submit.', issues.length ? 'warn' : 'ok'); if (issues[0]?.stepId) { app.selectedStepId = issues[0].stepId; renderEditor(); } return; }

    case 'add-next': e.stopPropagation(); stepMenu(e.clientX, e.clientY, type => addAfter(s.id, arg, type)); return;

    case 'seg-move': { const [i, d] = arg.split('|').map(Number), k = i + d; if (k < 0 || k >= s.config.segments.length) return; [s.config.segments[i], s.config.segments[k]] = [s.config.segments[k], s.config.segments[i]]; touch(j); renderEditor(); return; }
    case 'sh-add': s.config.paths.push({ label: `Path ${String.fromCharCode(65 + s.config.paths.length)}`, pct: 0 }); touch(j); renderEditor(); return;
    case 'sh-remove': s.config.paths.splice(+arg, 1); syncEdges(v, s); touch(j); renderEditor(); return;
    case 'sh-even': { const n = s.config.paths.length, base = Math.floor(100 / n); s.config.paths.forEach((p, i) => p.pct = base + (i < 100 - base * n ? 1 : 0)); touch(j); renderEditor(); return; }
    default: if (typeof handleVersionAct === 'function') handleVersionAct(act, arg, el, e);
  }
}

/* ---- [1] version actions, journey settings, test send, View changes ----------------- */
function handleVersionAct(act, arg, el, e) {
  if (act.startsWith('m-')) { handleMonitorAct(act, arg, el, e); return; }
  const j = curJourney(), v = curVersion(); if (!j || !v) return;
  const done = (title, msg, cls) => { touch(j); renderEditor(); if (title) toast(title, msg, cls); };
  switch (act) {
    case 'v-submit':
      openModal(modalHtml(`Submit v${v.no} for approval`, `<div class="fld"><label for="sub-note">Version note <small class="muted">— short, shown on the version and in the journey list</small></label><input id="sub-note" value="${esc(v.note)}" placeholder="e.g. V3 – add push reminder"></div><div class="info">${icon('info')} Activation needs approval. The approver sees the changes against the current Active version.</div>`,
        `<button class="btn outline" data-act="modal-close">Cancel</button><button class="btn primary" id="sub-go">Submit</button>`));
      $('sub-go').onclick = () => { const issues = validateVersion(v); if (issues.length) { toast('Fix the validation issues first', issues.map(i => '• ' + i.message).join('\n'), 'bad'); return; } VERSION_ACTIONS.submit(v, $('sub-note').value.trim()); closeModal(); done('Submitted for approval', 'The approver will find it in the Pending approval tab.'); };
      setTimeout(() => $('sub-note').focus(), 30); return;
    case 'v-withdraw': VERSION_ACTIONS.withdraw(v); done('Withdrawn', `v${v.no} is back in Draft.`); return;
    case 'v-approve': { const had = activeVersion(j.id); VERSION_ACTIONS.approve(v); done(`v${v.no} is now Active`, had ? `v${had.no} is Closing: contacts inside finish their path, no new entries.` : undefined, 'ok'); return; }
    case 'v-reject':
      openModal(modalHtml(`Reject v${v.no}`, `<div class="fld"><label for="rej-c">Comment <small class="muted">— required, shown to the marketer on the version</small></label><textarea id="rej-c" style="font-family:var(--sans);font-size:13px" placeholder="What should change before this can be activated?"></textarea></div>`,
        `<button class="btn outline" data-act="modal-close">Cancel</button><button class="btn danger" id="rej-go" disabled>Reject</button>`));
      $('rej-c').oninput = () => { $('rej-go').disabled = !$('rej-c').value.trim(); };
      $('rej-go').onclick = () => { VERSION_ACTIONS.reject(v, $('rej-c').value.trim()); closeModal(); closeModal('modal2'); done(`v${v.no} rejected`, 'It is back in Draft with your comment.', 'warn'); };
      setTimeout(() => $('rej-c').focus(), 30); return;
    case 'v-stop':
      openModal(modalHtml(`Stop v${v.no}`, `<p><b>Closing</b> — no new contacts enter; contacts already inside finish their path. The version then needs to be closed manually.</p><p><b>Closed</b> — no new entries and contacts inside are removed now.</p><p class="muted small">Stopping needs no approval.</p>`,
        `<button class="btn outline" data-act="modal-close">Cancel</button><button class="btn outline" id="stop-closing">Stop new entries (Closing)</button><button class="btn danger" id="stop-closed">Stop everything (Closed)</button>`));
      $('stop-closing').onclick = () => { VERSION_ACTIONS.stop(v, 'closing'); closeModal(); done(`v${v.no} is Closing`, 'No new entries; contacts inside finish their path.'); };
      $('stop-closed').onclick = () => { VERSION_ACTIONS.stop(v, 'closed'); closeModal(); done(`v${v.no} is Closed`, 'Contacts inside were removed from the journey.'); };
      return;
    case 'v-close': VERSION_ACTIONS.close(v); done(`v${v.no} closed`); return;
    case 'v-copy': { const nv = VERSION_ACTIONS.copy(v); app.versionId = nv.id; app.selectedStepId = null; canvasFor('cwrap').fitted = false; done(`v${nv.no} created as a draft`, 'Structure copied. Changes need approval before activation.'); return; }
    case 'v-delete': {
      const only = versionsOf(j.id).length === 1;
      openModal(modalHtml(only ? 'Delete this journey?' : `Delete v${v.no}?`, `<p>${only ? `“${esc(j.name)}” has only this draft. Deleting it removes the journey.` : 'The draft and its steps are removed. Other versions are not affected.'}</p>`,
        `<button class="btn outline" data-act="modal-close">Cancel</button><button class="btn danger" id="del-go">Delete</button>`));
      $('del-go').onclick = () => { VERSION_ACTIONS.delete(v); closeModal(); if (only) { JOURNEYS.splice(JOURNEYS.indexOf(j), 1); toast('Journey deleted'); showView('journeys'); } else { app.versionId = versionsOf(j.id)[0].id; app.selectedStepId = null; done(`v${v.no} deleted`); } };
      return;
    }
    case 'v-viewChanges': viewChangesModal(j, v); return;
    case 'history':
      openModal(modalHtml(`v${v.no} · history`, `${v.rejectComment ? `<div class="note">Rejected: “${esc(v.rejectComment)}”</div>` : ''}<div class="vhist">${[...v.history].reverse().map(h => `<div><span>${fmtDate(h.at, true)}</span><span>${esc(h.text)} <span class="muted">· ${esc(userName(h.by))}</span></span></div>`).join('') || '<span class="muted">No history yet.</span>'}</div>`)); return;
    case 'settings': settingsModal(j); return;
    case 'test-send': testSendModal(j, v); return;
    default: handleMonitorAct(act, arg, el, e);
  }
}

        <div class="fld"><label>Override unsubscribe</label><label class="ck"><input type="checkbox" id="st-ou" ${state.override ? 'checked' : ''}><span>Allow messages to unsubscribed contacts<small>Each Delivery then has a “Send even to unsubscribed” switch. The journey shows a chip.</small></span></label></div>

          <label class="search-in" style="max-width:none">${icon('search')}<input id="st-q" placeholder="Search ${esc(dmName(state.contactList))} by name, email or ID" value="${esc(state.q)}"></label>
          <div class="col" style="gap:2px;max-height:180px;overflow:auto">${shown.map(c => `<label class="ck" style="padding:3px 2px"><input type="checkbox" data-tu="${c.id}" ${state.testUsers.includes(c.id) ? 'checked' : ''}><span>${esc(c.firstName)} ${esc(c.lastName)} <span class="muted">· ${c.id} · ${esc(c.email)} · ${c.language.toUpperCase()}${c.phone ? '' : ' · no phone'}${c.pushToken ? '' : ' · no push'}</span></span></label>`).join('')}</div>
        </div>

    $('st-ou').onchange = e => {
      if (!e.target.checked) { state.override = false; return; }
      e.target.checked = false;
      openModal(modalHtml('Send to unsubscribed contacts?', `<p>Messages in this journey may be sent to contacts who unsubscribed from marketing. Use this only for service messages the contact must receive (e.g. a device they asked to be notified about).</p><p class="muted small">The journey list shows an “Override unsubscribe” chip while this is on.</p>`, `<button class="btn outline" data-act="modal-close">Cancel</button><button class="btn danger" id="ou-yes">Yes, allow override</button>`), 'sm', 'modal2');
      $('ou-yes').onclick = () => { state.override = true; closeModal('modal2'); $('st-ou').checked = true; };
    };
    $('st-q').oninput = e => { state.q = e.target.value; const pos = e.target.selectionStart; render(); $('st-q').focus(); $('st-q').setSelectionRange(pos, pos); };
    document.querySelectorAll('#modal [data-tu]').forEach(cb => cb.onchange = () => { if (cb.checked) state.testUsers.push(cb.dataset.tu); else state.testUsers = state.testUsers.filter(x => x !== cb.dataset.tu); render(); });

  };

  render();
}

/* [7] Test send: Delivery step, test user, editable payload → toast with the rendered preview */
function testSendModal(j, v) {
  const deliveries = v.steps.filter(s => s.type === 'delivery'), users = CONTACTS.filter(c => j.testUsers.includes(c.id)), ev = eventById(j.eventId);
  openModal(modalHtml('Test send', `
    ${deliveries.length ? '' : '<div class="note">This version has no Delivery step yet.</div>'}${users.length ? '' : '<div class="note">No test users — add some in Journey settings.</div>'}
    <div class="form2" style="padding:0">
      <div class="fld"><label for="ts-step">Delivery step</label><select id="ts-step">${deliveries.map(d => `<option value="${d.id}">${esc(d.name)} · ${CHANNEL_LABEL[d.config.channel]}</option>`).join('')}</select><small class="muted" id="ts-content"></small></div>
      <div class="fld"><label for="ts-user">Test user</label><select id="ts-user">${users.map(u => `<option value="${u.id}">${esc(u.firstName)} ${esc(u.lastName)} · ${u.id} · ${u.language.toUpperCase()}</option>`).join('')}</select></div>
      <div class="fld span2"><label for="ts-payload">Event payload <small class="muted">— ${esc(ev?.name ?? 'event')} sample, editable</small></label><textarea id="ts-payload" rows="6">${esc(JSON.stringify(Object.fromEntries((ev?.payload ?? []).map(p => [p.name, p.sample])), null, 2))}</textarea><small class="muted" id="ts-err"></small></div>
    </div><p class="muted small">The test goes to the test user only. Nothing moves on the canvas and nothing is counted in Monitor.</p>`,
    `<button class="btn outline" data-act="modal-close">Cancel</button><button class="btn primary" id="ts-go" ${deliveries.length && users.length ? '' : 'disabled'}>Send test</button>`), 'md');
  const upd = () => { const d = stepOf(v, $('ts-step').value), it = contentById(d?.config.contentId); $('ts-content').textContent = it ? `Content: ${it.name} · ${it.language.toUpperCase()}` : 'No content chosen on this step.'; };
  upd(); $('ts-step').onchange = upd;
  $('ts-go').onclick = () => {
    let payload; try { payload = JSON.parse($('ts-payload').value); $('ts-err').textContent = ''; } catch { $('ts-err').textContent = 'Not valid JSON.'; $('ts-err').style.color = 'var(--bad)'; return; }
    const d = stepOf(v, $('ts-step').value), u = CONTACTS.find(c => c.id === $('ts-user').value), it = contentById(d.config.contentId);
    if (!it) { toast('No content on this step', 'Choose content in the Delivery panel first.', 'warn'); return; }
    const unreachable = (d.config.channel === 'sms' && !u.phone) || (d.config.channel === 'push' && !u.pushToken);
    if (unreachable) { toast(`Test not sent · ${u.firstName} ${u.lastName}`, `This contact has no ${d.config.channel === 'sms' ? 'phone number' : 'push token'}. In the journey, the contact would skip this step and continue.`, 'warn'); return; }
    const values = { ...contactFields(u), ...Object.fromEntries(Object.entries(payload).map(([k, x]) => [k, String(x)])), ...offerFields(offerById(d.config.offerId)) };
    const to = d.config.channel === 'email' ? u.email : d.config.channel === 'sms' ? u.phone : `push token ${u.pushToken}`;
    closeModal(); toast(`Test ${CHANNEL_LABEL[d.config.channel]} sent to ${to} · ${it.name} (${it.language.toUpperCase()})`, renderContent(it, values), 'ok');
  };
}

/* [1] View changes (approver): pending version coloured against the current Active one; removed steps as ghost cards */
function viewChangesModal(j, v) {
  const active = activeVersion(j.id), d = diffVersions(v, active);
  const status = {}; for (const a of d.added) status[a.stepId] = 'added'; for (const c of d.changed) status[c.stepId] = 'changed'; for (const r of d.removed) status[r.stepId] = 'removed';
  // union version: pending steps + removed steps re-attached where they were
  const union = { steps: [...v.steps, ...(active?.steps ?? []).filter(s => status[s.id] === 'removed')], edges: [...v.edges] };
  const pIds = new Set(v.steps.map(s => s.id));
  for (const e of active?.edges ?? []) if ((!pIds.has(e.from) || !pIds.has(e.to)) && union.steps.some(s => s.id === e.from) && union.steps.some(s => s.id === e.to) && !union.edges.some(x => x.from === e.from && x.label === e.label)) union.edges.push({ ...e, _removed: true });
  const edgeStatus = e => e._removed ? 'removed' : (active && !active.edges.some(x => x.from === e.from && x.label === e.label && x.to === e.to) ? 'added' : undefined);
  const submitted = [...v.history].reverse().find(h => h.text.startsWith('Submitted'));
  const entries = [...d.added.map(x => ({ ...x, st: 'added' })), ...d.removed.map(x => ({ ...x, st: 'removed' })), ...d.changed.map(x => ({ ...x, st: 'changed' }))];
  openModal(modalHtml(`Changes in v${v.no} ${active ? `<span class="muted">vs. v${active.no} (Active)</span>` : '<span class="muted">— first activation</span>'}`, `
    <div class="legend2"><span class="added"><i></i>Added</span><span class="removed"><i></i>Removed</span><span class="changed"><i></i>Changed</span><span class="muted">· ${d.structureChanged ? 'Structure changed — approval required.' : 'Only the content choice changed.'}</span></div>
    <div class="diff"><div class="canvas-wrap" id="dwrap" style="border:0;border-radius:0"><svg class="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="side"><div><div class="small muted" style="text-transform:uppercase;letter-spacing:.05em;font-size:10.5px">Marketer’s note</div><div style="font-weight:500">${esc(v.note) || '<span class="muted">No note</span>'}</div>${submitted ? `<div class="small muted">${esc(submitted.text.replace(/^Submitted for approval:?\s*/, ''))} — ${esc(userName(submitted.by))}</div>` : ''}</div>
        <div class="small muted" style="text-transform:uppercase;letter-spacing:.05em;font-size:10.5px">${entries.length} change${entries.length === 1 ? '' : 's'}</div>
        ${entries.map(x => `<div class="de ${x.st}"><b>${esc(x.name)}</b><span class="muted">${esc(x.detail)}</span></div>`).join('') || '<div class="muted small">No differences found.</div>'}</div></div>`,
    `<button class="btn outline" data-act="modal-close">Close</button>${app.role === 'approver' ? `<button class="btn outline" data-act="v-reject">Reject…</button><button class="btn primary" id="vc-approve">${icon('check')} Approve and activate</button>` : ''}`), 'xl');
  if ($('vc-approve')) $('vc-approve').onclick = () => { closeModal(); handleVersionAct('v-approve'); };
  CANVASES.delete('dwrap'); wireCanvasReset('dwrap');
  drawCanvas('dwrap', buildGraph(union, { status, edgeStatus }), { orientation: j.orientation, version: union, journey: j });
}
function wireCanvasReset(id, handlers = {}) { const wrap = $(id); if (wrap) { delete wrap.dataset.wired; wireCanvas(id, handlers); } }

/* ---- Screen 3 — Journey Monitor [6][2][1] ------------------------------------------ */
const RANGES = [['7', 'Last 7 days', 7], ['30', 'Last 30 days', 30], ['90', 'Last 90 days', 90], ['all', 'All time', 0]];
const STATUSES = ['Waiting', 'In step', 'Exited', 'Skipped', 'Control group'];
function renderMonitor() {
  const m = app.monitor; let j = JOURNEYS.find(x => x.id === m.journeyId); if (!j) { j = JOURNEYS[0]; m.journeyId = j?.id; }
  crumb(Object.assign([{ label: 'Journey Monitor' }, { label: j?.name ?? '' }], { right: j ? `<span class="right"><button class="btn sm outline" data-act="go-editor" data-arg="${j.id}">${icon('journeys')} Open editor</button></span>` : '' }));
  if (!j) { $('view-monitor').innerHTML = '<div class="card"><div class="empty">No journeys.</div></div>'; return; }
  const vs = versionsOf(j.id); let v = vs.find(x => x.id === m.versionId) ?? primaryVersion(j); m.versionId = v?.id;
  const days = RANGES.find(r => r[0] === m.range)[2], since = days ? iso(NOW.getTime() - days * DAY) : '';
  const all = statesFor(j.id, null, since), states = v ? all.filter(s => s.versionId === v.id) : [];
  const tabs = [['overview', 'Overview'], ['flow', `Flow <span class="cnt">v${v?.no ?? '—'}</span>`], ['contacts', `Contacts <span class="cnt">${states.length}</span>`]];
  $('view-monitor').innerHTML = `
    <div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column">
      <div class="card-h" style="padding-bottom:6px"><h2>Journey Monitor</h2><p>Per-customer journey state, step statistics and the path of any single contact.</p></div>
      <div class="toolrow" style="padding-top:0">
        <label for="msel" style="color:var(--ink-2)">Journey</label><select id="msel">${JOURNEYS.map(x => `<option value="${x.id}" ${x.id === j.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
        ${pill(dmName(j.contactList))}${j.overrideUnsubscribe ? `<span class="badge-ou">${icon('warn', 11)} Override unsubscribe</span>` : ''}
        <div class="grow"></div>
        ${m.tab !== 'overview' ? `<label for="mvsel" style="color:var(--ink-2)">Version</label><select id="mvsel">${vs.map(x => `<option value="${x.id}" ${x.id === v?.id ? 'selected' : ''}>v${x.no} · ${STATUS_LABEL[x.status]}${x.note ? ` · ${esc(x.note)}` : ''}</option>`).join('')}</select>` : ''}
        <label for="mrange" style="color:var(--ink-2)">Entries</label><select id="mrange">${RANGES.map(r => `<option value="${r[0]}" ${m.range === r[0] ? 'selected' : ''}>${r[1]}</option>`).join('')}</select>
      </div>
      <div class="card-b mon" style="padding-top:0">
        <div class="tabs">${tabs.map(([k, l]) => `<button class="${m.tab === k ? 'on' : ''}" data-act="m-tab" data-arg="${k}">${l}</button>`).join('')}<span class="muted small" style="align-self:center;margin-left:auto">Entries ${since ? `since ${since.slice(0, 10)}` : 'all time'} · as of ${NOW.toISOString().slice(0, 16).replace('T', ' ')} UTC</span></div>
        ${m.tab === 'overview' ? overviewHtml(j, vs, all) : m.tab === 'flow' ? `<div style="display:flex;flex:1;min-height:0;flex-direction:column;gap:6px"><div class="small muted">Read-only canvas of v${v.no}. Click a step to open its contacts.</div><div class="canvas-wrap" id="mwrap"><svg class="canvas" xmlns="http://www.w3.org/2000/svg"></svg><div class="ctools"><button data-act="m-zoom-out" title="Zoom out">${icon('zoomout')}</button><button data-act="m-zoom-in" title="Zoom in">${icon('zoomin')}</button><button data-act="m-fit" title="Fit">${icon('fit')}</button><span class="zoomlbl num small muted">100 %</span></div></div></div>` : contactsHtml(j, v, states)}
      </div>
    </div>`;
  $('msel').onchange = e => { m.journeyId = e.target.value; m.versionId = null; m.step = ''; m.contactId = null; CANVASES.delete('mwrap'); renderMonitor(); };
  if ($('mvsel')) $('mvsel').onchange = e => { m.versionId = e.target.value; m.step = ''; CANVASES.delete('mwrap'); renderMonitor(); };
  $('mrange').onchange = e => { m.range = e.target.value; renderMonitor(); };
  if (m.tab === 'flow' && v) {
    const cv = canvasFor('mwrap'); cv.fitted = false;
    const st = stepStats(v, states);
    const stats = s => { const o = st[s.id]; if (!o) return null; if (s.type === 'exit') return [['exited', o.entered]]; if (s.type === 'controlGroup') return [['in group', o.entered]]; const base = [['entered', o.entered], ['waiting', o.waiting], ['exited', o.exited]]; if (s.type === 'delivery') base.push(['sent', o.sent], ['skipped', o.skipped, o.skipped ? 'skip' : ''], ...(s.config.channel !== 'sms' ? [['opened', o.opened]] : []), ['clicked', o.clicked]); return base; };
    const edgeStat = e => { const o = st[e.from], s = stepOf(v, e.from); if (!o || !s || !isSplit(s)) return undefined; const n = o.paths[e.key] ?? 0; return `${n} · ${pct(n, o.entered - o.waiting)} %`; };
    wireCanvasReset('mwrap', { onSelect: id => { m.step = id; m.tab = 'contacts'; renderMonitor(); } });
    drawCanvas('mwrap', buildGraph(v), { orientation: j.orientation, version: v, journey: j, stats, edgeStat });
  }
  if (m.tab === 'contacts') wireContacts(j, v, states);
}
/* zoom label for the monitor canvas lives inside the wrap */
function overviewHtml(j, vs, all) {
  const t = totals(all), ch = channelStats(all, vs), of = offerStats(all, vs);
  const perV = Object.fromEntries(vs.map(v => [v.id, totals(all.filter(s => s.versionId === v.id))]));
  const tile = (l, v, s) => `<div class="stat tile"><div class="l">${l}</div><div class="v num">${fmtNum(v)}</div><div class="s">${s}</div></div>`;
  return `<div class="col" style="gap:16px;overflow:auto;flex:1;min-height:0">
    <div class="stats" style="padding:0">${tile('Entered', t.entered, 'contacts received the event')}${tile('In journey now', t.inside, 'waiting or in a step')}${tile('Exited', t.exited, `${pct(t.exited, t.entered)} % of entered`)}${tile('Skipped', t.skipped, 'exited after an unreachable step')}${tile('Control group', t.control, 'kept for comparison')}</div>
    <div><div class="sec">Channel breakdown</div><table class="tbl" style="margin-top:6px"><thead><tr><th>Channel</th><th class="r">Sent</th><th class="r">Opened</th><th class="r">Clicked</th><th class="r">Skipped</th><th>Open rate</th></tr></thead><tbody>
      ${CHANNELS.map(c => { const s = ch[c], any = s.sent + s.skipped > 0; return `<tr ${any ? '' : 'style="color:var(--ink-3)"'}><td><span class="hrow">${chanIcon(c)} ${CHANNEL_LABEL[c]}</span></td><td class="r num">${fmtNum(s.sent)}</td><td class="r num">${c === 'sms' ? '<span class="muted" title="SMS has no open tracking">—</span>' : fmtNum(s.opened)}</td><td class="r num">${fmtNum(s.clicked)}</td><td class="r num" ${s.skipped ? 'style="color:var(--bad)"' : ''}>${fmtNum(s.skipped)}</td><td style="width:220px">${c !== 'sms' && any ? `<span class="hrow"><span class="pbar" style="width:120px"><i style="width:${pct(s.opened, s.sent)}%"></i></span><span class="small num">${pct(s.opened, s.sent)} %</span></span>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>
    ${Object.keys(of).length ? `<div><div class="sec">Offers <span class="muted small" style="font-weight:400">— sends attributed to the Delivery's offer</span></div><table class="tbl" style="margin-top:6px"><thead><tr><th>Offer</th><th>Code</th><th class="r">Sent</th><th class="r">Opened</th><th class="r">Clicked</th><th>Click rate</th></tr></thead><tbody>
      ${OFFERS.filter(o => of[o.id]).map(o => { const s = of[o.id]; return `<tr><td class="t1">${esc(o.name)}</td><td class="mono">${o.code}</td><td class="r num">${fmtNum(s.sent)}</td><td class="r num">${fmtNum(s.opened)}</td><td class="r num">${fmtNum(s.clicked)}</td><td style="width:220px"><span class="hrow"><span class="pbar" style="width:120px"><i style="width:${pct(s.clicked, s.sent)}%"></i></span><span class="small num">${pct(s.clicked, s.sent)} %</span></span></td></tr>`; }).join('')}</tbody></table></div>` : ''}
    <div><div class="sec">Versions</div><table class="tbl" style="margin-top:6px"><thead><tr><th>Version</th><th>Status</th><th>Note</th><th>Activated by / when</th><th class="r">Entered</th><th class="r">Inside</th><th class="r">Exited</th></tr></thead><tbody>
      ${vs.map(v => { const s = perV[v.id]; return `<tr><td class="t1">v${v.no}</td><td>${vpill(v.status)}</td><td>${esc(v.note) || '<span class="muted">—</span>'}</td><td>${v.approvedBy ? `${esc(userName(v.approvedBy))} <span class="muted">· ${fmtDate(v.approvedAt, true)}</span>` : '<span class="muted">Not activated</span>'}</td><td class="r num">${fmtNum(s.entered)}</td><td class="r num">${fmtNum(s.inside)}</td><td class="r num">${fmtNum(s.exited + s.skipped + s.control)}</td></tr>`; }).join('')}</tbody></table></div>
  </div>`;
}
function contactsHtml(j, v, states) {
  const m = app.monitor, q = m.q.trim().toLowerCase(), byId = new Map(CONTACTS.map(c => [c.id, c]));
  const rows = states.filter(s => { const c = byId.get(s.contactId); if (!c) return false; if (m.step && s.stepId !== m.step) return false; if (m.status && s.status !== m.status) return false; if (q && !(c.id.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || (c.phone ?? '').replace(/\s/g, '').includes(q.replace(/\s/g, '')))) return false; return true; }).sort((a, b) => b.receivedAt.localeCompare(a.receivedAt));
  const stepName = id => stepOf(v, id)?.name ?? '?';
  return `<div class="col" style="gap:10px;flex:1;min-height:0">
    <div class="hrow wrap" style="gap:10px">
      <label class="search-in">${icon('search')}<input id="mc-q" placeholder="Search by contact ID, email or phone" value="${esc(m.q)}"></label>
      <select class="inp" id="mc-step" style="width:240px"><option value="">All steps</option>${v.steps.map(s => `<option value="${s.id}" ${m.step === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
      <select class="inp" id="mc-status" style="width:170px"><option value="">All statuses</option>${STATUSES.map(s => `<option ${m.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      ${m.step || m.status || m.q ? `<button class="btn link sm" data-act="m-clear">Clear</button>` : ''}<span class="muted small right">${rows.length} contact${rows.length === 1 ? '' : 's'}</span>
    </div>
    <div style="overflow:auto;flex:1;min-height:0"><table class="tbl" id="mc-table"><thead><tr><th>Contact</th><th>Event</th><th>Received at</th><th>Current step</th><th>Status</th><th>Last delivery result</th></tr></thead><tbody>
      ${rows.length ? rows.slice(0, 200).map(s => { const c = byId.get(s.contactId); return `<tr class="row" data-act="m-contact" data-arg="${s.id}"><td><div class="t1">${esc(c.firstName)} ${esc(c.lastName)}</div><div class="t2">${c.id} · ${esc(c.email)}${c.phone ? ` · ${c.phone}` : ''} · ${c.language.toUpperCase()}</div></td><td>${esc(eventById(j.eventId)?.name ?? '')}</td><td class="nw">${fmtDate(s.receivedAt, true)}</td><td>${esc(stepName(s.stepId))}</td><td>${pill(s.status + (s.status === 'Waiting' && s.waitKind ? ` · ${s.waitKind}` : ''), CONTACT_STATUS_CLS[s.status])}</td><td>${esc(s.lastDelivery)}</td></tr>`; }).join('') : '<tr><td colspan="6" class="empty">No contacts match.</td></tr>'}
    </tbody></table>${rows.length > 200 ? `<div class="empty">Showing the first 200 of ${rows.length}. Narrow the search to see others.</div>` : ''}</div></div>`;
}
function wireContacts(j, v, states) {
  const m = app.monitor;
  $('mc-q').oninput = e => { m.q = e.target.value; const p = e.target.selectionStart; renderMonitor(); $('mc-q').focus(); $('mc-q').setSelectionRange(p, p); };
  $('mc-step').onchange = e => { m.step = e.target.value; renderMonitor(); };
  $('mc-status').onchange = e => { m.status = e.target.value; renderMonitor(); };
}
/* "Where is this contact now?" — payload, timeline, path highlighted on a mini canvas */
function contactPanel(stateId) {
  const st = CONTACT_STATES.find(s => s.id === stateId); if (!st) return;
  const j = JOURNEYS.find(x => x.id === st.journeyId), v = VERSIONS.find(x => x.id === st.versionId), c = CONTACTS.find(x => x.id === st.contactId);
  const stepName = id => stepOf(v, id)?.name ?? '?';
  const visited = st.history.filter(l => l.event === 'entered').map(l => l.stepId), hl = new Set(visited), hlE = new Set();
  for (let i = 0; i < visited.length - 1; i++) { const e = v.edges.find(x => x.from === visited[i] && x.to === visited[i + 1]); if (e) hlE.add(`${e.from}:${e.label}`); }
  $('drawer-host').innerHTML = `<div class="drawer-bg" data-act="m-close-panel"></div><div class="drawer" role="dialog" aria-modal="true">
    <div class="dh"><div><h3>Where is ${esc(c.firstName)} ${esc(c.lastName)} now?</h3><div class="small muted">${c.id} · ${esc(c.email)}${c.phone ? ` · ${c.phone}` : ' · no phone'}${c.pushToken ? '' : ' · no push token'} · ${c.language.toUpperCase()} · ${esc(c.plan)}</div></div>
      <div class="right hrow" style="gap:8px"><span class="small muted">Now at</span><b>${esc(stepName(st.stepId))}</b>${pill(st.status + (st.status === 'Waiting' && st.waitKind ? ` · ${st.waitKind}` : ''), CONTACT_STATUS_CLS[st.status])}<button class="x" data-act="m-close-panel" aria-label="Close">×</button></div></div>
    <div class="db"><div class="dl">
      <div><div class="sec" style="padding-top:0">Event · ${esc(eventById(j.eventId)?.name ?? '')}</div><dl class="kv" style="margin-top:6px"><dt>received at</dt><dd>${fmtDate(st.receivedAt, true)}</dd><dt>version</dt><dd>v${v.no}</dd>${Object.entries(st.payload).map(([k, x]) => `<dt class="mono">${k}</dt><dd style="word-break:break-all">${esc(x)}</dd>`).join('')}</dl></div>
      <div><div class="sec">Timeline</div><div class="timeline" style="margin-top:8px">${st.history.map(l => `<div class="tl k-${l.event}"><span class="tt">${fmtDate(l.at, true)}</span><span class="dot"></span><span class="tb">${esc(l.detail)}<small>${esc(stepName(l.stepId))}</small></span></div>`).join('')}${st.status === 'Waiting' || st.status === 'In step' ? `<div class="tl k-now"><span class="tt">now</span><span class="dot"></span><span class="tb">${st.status === 'Waiting' ? `Waiting · ${st.waitKind ?? 'Duration'}` : 'In step — being processed'}<small>${esc(stepName(st.stepId))}</small></span></div>` : ''}</div></div>
    </div><div class="dr"><div class="small muted" style="padding:0 4px 8px">The contact’s path is highlighted on v${v.no}.</div><div class="canvas-wrap" id="pwrap"><svg class="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div></div></div></div>`;
  CANVASES.delete('pwrap'); wireCanvasReset('pwrap');
  drawCanvas('pwrap', buildGraph(v), { orientation: j.orientation, version: v, journey: j, highlight: hl, highlightEdges: hlE });
}
function handleMonitorAct(act, arg) {
  const m = app.monitor;
  switch (act) {
    case 'm-tab': m.tab = arg; if (arg !== 'contacts') m.step = ''; renderMonitor(); return;
    case 'm-clear': m.q = ''; m.step = ''; m.status = ''; renderMonitor(); return;
    case 'm-contact': contactPanel(arg); return;
    case 'm-close-panel': $('drawer-host').innerHTML = ''; return;
    case 'm-zoom-in': zoomCanvas('mwrap', 1.2); return;
    case 'm-zoom-out': zoomCanvas('mwrap', 1 / 1.2); return;
    case 'm-fit': fitCanvasOf('mwrap'); return;
  }
}

/* ---- global event delegation: every control carries data-act ---- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  if (act === 'modal-close') { closeModal(el.closest('.modal-bg').id); return; }
  if (act === 'go-journeys') { showView('journeys'); return; }
  if (act === 'go-editor') { openEditor(arg, el.dataset.v || undefined); return; }
  if (act === 'go-monitor') { openMonitor(arg); return; }
  if (act === 'list-tab') { app.list.tab = arg; renderJourneyList(); return; }
  if (act === 'new-journey') { const n = JOURNEYS.filter(x => x.name.startsWith('New journey')).length; const { j, v } = createJourney({ name: n ? `New journey ${n + 1}` : 'New journey', eventId: EVENTS[0].id, entryMode: 'single', contactList: 'DM-1' }); toast('Journey created', 'Event entry and Exit are placed. Pick the event, entry mode and contact list in the Event entry panel; the name is in Journey settings.'); openEditor(j.id, v.id, v.steps[0].id); return; }
  if (act === 'row-menu') { e.stopPropagation(); rowMenu(el, arg); return; }
  if (act === 'open-journey') { if (e.target.closest('[data-stop]') && el.tagName === 'TR') return; openEditor(el.dataset.jid ?? arg, el.dataset.v || undefined); return; }
  if (act === 'duplicate') { const j = JOURNEYS.find(x => x.id === arg); const c = duplicateJourney(j); toast('Journey duplicated', `“${c.name}” created as a draft.`); app.list.tab = 'draft'; renderJourneyList(); return; }
  if (typeof handleAct === 'function') handleAct(act, arg, el, e);
});
document.querySelectorAll('.nav button[data-view]').forEach(b => b.addEventListener('click', () => { if (b.dataset.view === 'monitor') openMonitor(app.journeyId ?? app.monitor.journeyId); else showView('journeys'); }));
document.querySelectorAll('.nav button .nl').forEach(l => l.parentElement.title = l.textContent.trim());
$('btn-nav').onclick = () => { const closed = document.querySelector('.app').classList.toggle('nav-closed'); $('btn-nav').classList.toggle('on', closed); $('btn-nav').title = closed ? 'Expand menu' : 'Collapse menu'; setTimeout(fitCanvas, 170); };
$('role-sel').onchange = e => applyRole(e.target.value);
$('btn-reset').onclick = () => { resetDemo(); app.journeyId = null; app.versionId = null; app.selectedStepId = null; app.monitor.journeyId = null; showView('journeys'); toast('Demo data reset', 'Every change made in this session was discarded.'); };

/* boot */
applyRole('marketer');
showView('journeys');
</script>
</body>
</html>
